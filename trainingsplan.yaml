      dauer: 120
      titel: Monatsturnier 3:3
      schwerpunkt:
        kurz: 'Drei Kontakte genutzt'
        achte_auf: 'Lobe jeden Ballwechsel, in dem eine Mannschaft alle drei Kontakte spielt, auch wenn der Punkt verloren geht. Bälle, die direkt zurückgespielt werden, kommentierst du nicht.'
