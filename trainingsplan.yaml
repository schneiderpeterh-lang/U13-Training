        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball hochwerfen, darunter laufen, zum Netz drehen und pritschen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Pritschen zum Ziel: erst drehen, dann spielen'
        bild: bilder/pritschen-drehen.svg
        inhalt: |-
          **Ablauf:** 4er-Gruppen. A wirft hoch zu B in der Mitte. Links und rechts von B steht je ein Fänger C. Wenn der Ball oben ist, ruft A „Links!“ oder „Rechts!“. B dreht sich unter dem Ball zum genannten C und pritscht zu ihm. Nach 8 Bällen rotieren.

          * Gesicht und Bauchnabel zeigen beim Pass immer zum Ziel. Erst drehen, dann spielen.
          * 🟢 A ruft schon vor dem Wurf. B darf den Ball fangen, drehen und aus dem Körbchen zu C pritschen.
          * 🔵 Ruf, wenn der Ball oben ist. B pritscht direkt, C fängt ohne Schritt.
          * 🔴 Ruf erst kurz vor dem Kontakt, oder A pritscht statt zu werfen.

          **Trainer-Details:** Das ist die Grundlage fürs Zuspiel: Wer sich nicht zum Ziel dreht, pritscht seitlich und der Ball fliegt schief. Kurze, schnelle Schritte unter den Ball, die Füße zeigen zum Ziel.
        varianten:
          6-8: Eine 4er-Gruppe plus eine 3er-Gruppe; dort ruft der Werfer, und es gibt nur ein Ziel, das wechselt die Seite.
          9-12: Drei 4er-Gruppen gleichzeitig, Fänger wechseln nach jedem Durchgang ins Werfen.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Zuspiel am Netz
        bild: bilder/zuspiel-netz.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: A wirft vom Feldmittelpunkt zum Netz, B (Zuspieler) läuft von rechts hinten nach Pos III und pritscht hoch zu C auf Pos IV, C fängt.

          * 🟢 B fängt über der Stirn, dreht sich zu C und pritscht.
          * 🔵 B pritscht direkt zu C.
          * 🔴 Ziel: Ball 2 m über die Netzkante, 1 m vom Netz entfernt.

          **Trainer-Details:** Zuspieler steht mit der rechten Schulter zum Netz, Gesicht zu Pos IV. Hoher Ball = Zeit für den Angreifer.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme – Zuspiel – Fangen
        bild: bilder/zuspiel-kette.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen am Netz: Trainer/Werfer von der anderen Seite, A nimmt an, B spielt zu, C fängt auf Pos IV.

          * 🟢 Wurf über das Netz, Annahme darf gefangen und zum Zuspieler geworfen werden.
          * 🔵 Volle Kette ohne Fangen.
          * 🔴 C pritscht oder spielt den Ball über das Netz zurück (3. Kontakt).

          **Trainer-Details:** Dies ist der Kern des Volleyballs. Nach 5 Bällen Positionen wechseln.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 15
        titel: 2:2 mit Zuspielerregel
        bild: bilder/2v2-zuspielerregel.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Der 2. Kontakt muss immer ein Pritschball sein.
          * Wer nicht annimmt, spielt zu.
          * 🟢 Zuspiel darf gefangen und geworfen werden. 🔵 Pritsche Pflicht. 🔴 3 Kontakte Pflicht.

          **Trainer-Details:** Laut rufen: „Ich!“ bei der Annahme, „Hier!“ beim Zuspieler.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 2:2
        bild: bilder/kaiser-2v2.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (2:2). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Kaiserfeld: Drei Kontakte Pflicht.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat heute die meisten Zuspiele gemacht?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 4
      tag: Freitag
      dauer: 120
      titel: Drei Kontakte im 2:2
      schwerpunkt:
        kurz: '„Ich!“ rufen'
        achte_auf: 'Vor jedem Ball ruft das Kind, das ihn spielt, laut „Ich!“, und zwar bevor der Ball über das Netz kommt. Das verhindert Zusammenstöße und Bälle, die zwischen zwei Kindern fallen.'
        sag_dazu: 'Wer ruft, spielt!'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Pritsch-Staffel
        bild: bilder/pritsch-staffel.svg
        inhalt: |-
          **Ablauf:** Gruppen à 3 Kinder an der Grundlinie, Hütchen bei 9 m. Danach 3 Minuten Mobilisation.

          * Runde 1: Ball über der Stirn in Pritschhaltung tragen, ums Hütchen, zurück.
          * Runde 2: Ball unterwegs 3x hochwerfen und über der Stirn fangen.
          * 🟢/🔵/🔴 Runde 3: Fang-Pritschen, Pritschen im Gehen oder Pritschen im Laufen.

          **Trainer-Details:** Kleine Gruppen, damit niemand lange wartet. Lieber 5 kurze Runden als 2 lange.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Bagger-Beinarbeit: laufen, stoppen, spielen'
        bild: bilder/bagger-beinarbeit.svg
        inhalt: |-
          **Ablauf:** Jedes Kind steht zwischen drei Hütchen (vorn, links, rechts, je 2 m entfernt). Erst ohne Ball, dann mit Partner.

          * **Schattenlauf (3 Min):** Trainer zeigt mit dem Arm eine Richtung. Alle machen 2 Sidesteps (oder 2 Schritte nach vorn), stoppen in der Grundstellung, bilden das Brett und machen eine Baggerbewegung ohne Ball. Zurück in die Mitte.
          * **Spiegeln (3 Min):** Paare gegenüber. A bewegt sich seitlich hin und her und stoppt plötzlich. B spiegelt jede Bewegung und steht im Stopp sofort mit Brett.
          * **Laufen, stoppen, spielen (4 Min):** A wirft den Ball neben ein Hütchen. B läuft hin, stoppt hinter dem Ball und baggert zu A zurück.
          * 🟢 Der Ball darf einmal aufspringen, dann baggern.
          * 🔵 Direkt baggern, A soll ohne Schritt fangen können.
          * 🔴 A zeigt erst im letzten Moment die Richtung (Ball wird spät geworfen), 10 in Folge fangbar.

          **Trainer-Details:** Leitsatz: „Erst stehen, dann spielen.“ Sidesteps flach über den Boden, Füße kreuzen nicht. Beim Stopp sind die Füße schulterbreit, das Gewicht vorn. **Die 3 Merkpunkte (Brett):** 1. Hand in Hand legen, Daumen liegen parallel nebeneinander. 2. Arme gestreckt, Ellbogen zusammen, so wird das Brett flach. 3. Knie gebeugt, Ball vor dem Körper treffen, gespielt wird aus den Beinen, nicht aus den Armen.
        varianten: &id001
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen im Paar mit Netz
        bild: bilder/paar-netz.svg
        inhalt: |-
          **Ablauf:** Paare über das Netz, 2 Kontakte pro Seite (Selbstpass + rüber).

          * 🟢 Selbstpass darf gefangen werden. 🔵 Durchgehend. 🔴 3 Kontakte allein (Bagger – Pritsche – rüber).

          **Trainer-Details:** Das ist die Brücke zum Spiel: kontrollieren, dann spielen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Rund um die Positionen
        bild: bilder/zuspiel-positionen.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: Annahme (Pos V) – Zuspiel (Pos III) – Pass zurück über das Netz (Pos IV). Nach jedem Ball eine Position weiter.

          * 🟢 Werfen über das Netz, jeder Kontakt darf einmal gefangen werden.
          * 🔵 Aufschlag von unten, kein Fangen.
          * 🔴 3. Kontakt muss gezielt in eine Zone gespielt werden.

          **Trainer-Details:** Jedes Kind kommt auf jede Position. Positionsspezialisierung ist in der U13 nicht das Ziel.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: Aufschlag-Challenge
        bild: bilder/aufschlag-challenge.svg
        inhalt: |-
          **Ablauf:** Paare an beiden Seiten des Netzes (bzw. Leine), je ein Ball pro Paar. Aufschlag aus der Distanz, die zur Stufe passt.

          * 🟢 Aufschlag von unten aus 4–5 m Entfernung vom Netz.
          * 🔵 Aufschlag von unten aus 6–7 m.
          * 🔴 Aufschlag von unten von der Grundlinie, oder Einstieg Aufschlag von oben (Tennisaufschlag) aus 6 m.
          * Ziel: 10 Aufschläge, jeder Treffer in die hintere Feldhälfte zählt 2 Punkte, vordere Hälfte 1 Punkt.

          **Trainer-Details:** Ball ruhig in der Hand halten, nicht hochwerfen. Schlagarm pendelt gerade nach vorn, Gewicht auf den vorderen Fuß. Wer 8 von 10 trifft, geht 1 m zurück.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 2:2 nur mit 3 Kontakten
        bild: bilder/2v2-drei-kontakte.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Punkt zählt nur, wenn das Team 3 Kontakte gespielt hat (sonst Wiederholung).
          * 🟢 Ein Kontakt darf gefangen werden.

          **Trainer-Details:** Fehler beim 3-Kontakte-Versuch werden nicht bestraft. Lange Ballwechsel = viele Kontakte.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 3:3 kennenlernen
        bild: bilder/3v3-kennenlernen.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Feld ca. 6 × 6 m pro Seite. Ein Spieler vorn (Zuspieler), zwei hinten.

          * Nach jedem Aufschlagwechsel des eigenen Teams eine Position weiterrotieren.
          * 🟢 Annahme darf gefangen werden. 🔵 Kein Fangen. 🔴 3 Kontakte Pflicht.

          **Trainer-Details:** Erstes Kennenlernen des 3:3 aus der RTK-Spielreihe: Wer ist vorn, wer hinten? Viele kurze Spiele bis 7.
        varianten:
          6-8: Ein Feld 3:3, übrige Kinder spielen 1:1 nebenan und wechseln nach jedem Spiel.
          9-12: Zwei Felder 3:3, Teams gemischt.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Frage: Wer steht im 3:3 vorne und was macht er?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
