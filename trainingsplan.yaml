        phase: Technik II
        dauer: 10
        titel: Einspielen Bagger/Pritsche
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare, freies Einspielen, Trainer gibt Wechsel vor.

          * 🟢/🔵/🔴 nach Abzeichen aus Monat 1.

          **Trainer-Details:** Kurze Wiederholung der Basics; jedes Kind versucht 5 Kontakte mehr als beim Abzeichen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Aufschlag-Serien
        bild: bilder/aufschlag-serien.svg
        inhalt: |-
          **Ablauf:** Paare an beiden Seiten des Netzes (bzw. Leine), je ein Ball pro Paar. Aufschlag aus der Distanz, die zur Stufe passt.

          * 🟢 Aufschlag von unten aus 4–5 m Entfernung vom Netz.
          * 🔵 Aufschlag von unten aus 6–7 m.
          * 🔴 Aufschlag von unten von der Grundlinie, oder Einstieg Aufschlag von oben (Tennisaufschlag) aus 6 m.
          * Ziel: 5 Aufschläge in Folge ohne Fehler. Wer es schafft, wählt eine schwierigere Zone oder Aufschlag von oben.

          **Trainer-Details:** Ball ruhig in der Hand halten, nicht hochwerfen. Schlagarm pendelt gerade nach vorn, Gewicht auf den vorderen Fuß. Wer 8 von 10 trifft, geht 1 m zurück.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme im 3er-Riegel
        bild: bilder/annahme-riegel.svg
        inhalt: |-
          **Ablauf:** Auf jedem Feld: 3 Annehmer (Pos I, VI, V) gegen Aufschläger, ein Zuspieler am Netz.

          * Annehmer rufen „Ich!“, wer nicht annimmt, öffnet sich zum Annehmer.
          * 🟢 Zuspieler fängt. 🔵 Zuspieler pritscht zu Pos IV. 🔴 Zuspiel wird verwertet (über das Netz).

          **Trainer-Details:** Absprache: Bälle zwischen zwei Spielern nimmt der, der weiter zur Mitte steht.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
