          * Wer hat seinen ersten Aufschlag von oben über das Netz geschlagen?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 6
      tag: Freitag
      dauer: 120
      titel: 3:3 mit Aufschlag und Annahme
      schwerpunkt:
        kurz: 'Schultern zeigen zum Zuspieler'
        achte_auf: 'Bei der Annahme zeigt das Brett mit den Schultern zum Zuspieler. Kommt der Ball von der Seite, kippt die äußere Schulter etwas tiefer, die Arme schwingen nicht hinterher.'
        sag_dazu: 'Schultern zum Zuspieler!'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Zonenfangen
        bild: bilder/zonenfangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Feld ist in 6 Zonen (wie die Positionen) geteilt. Fänger ruft eine Zone, alle müssen dorthin laufen, wer zuletzt kommt, wird Fänger.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Brett kippen: Schultern zum Ziel'
        bild: bilder/bagger-kippen.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen im rechten Winkel. A wirft von der Seite zu B, B baggert nach vorn zu C. C fängt. Nach 8 Würfen Rollen tauschen, danach A auf die andere Seite.

          * Vor dem Ball dreht B die Schultern zu C. Das Brett zeigt zu C, nicht zum Werfer.
          * Bei Bällen von rechts: rechte Schulter etwas tiefer, das Brett kippt zum Ziel. Von links umgekehrt.
          * 🟢 A wirft auf den Bauch von B, kleiner Winkel (C steht schräg vor B).
          * 🔵 Voller rechter Winkel, C soll ohne Schritt fangen können.
          * 🔴 A wirft 1 Schritt neben B. B läuft, stoppt, dreht und baggert. Ziel: 6 von 8 bei C.

          **Trainer-Details:** Der Ball fliegt dahin, wohin das Brett zeigt. Kinder baggern gern zurück zum Werfer, weil sie ihn anschauen. Deshalb: Blick zum Ball, Bauchnabel zum Ziel. **Die 3 Merkpunkte (Brett):** 1. Hand in Hand legen, Daumen liegen parallel nebeneinander. 2. Arme gestreckt, Ellbogen zusammen, so wird das Brett flach. 3. Knie gebeugt, Ball vor dem Körper treffen, gespielt wird aus den Beinen, nicht aus den Armen.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
