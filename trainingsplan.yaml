- name: System-Spezial
  thema: 3v3 meets 4v4
  titel: Transition & Kognition (Pos I bis IV)
  wochen:
  - name: Einheit
    einheiten:
    - name: Spezial-Einheit
      dauer: 75
      titel: Transition & Kognition (Pos I bis IV)
      uebungen:
      - icon: ⏱️
        phase: Der Transition-Läufer
        dauer: 15
        inhalt: |-
          **Aus der Abwehr ins Zuspiel (Pos I -> Pos III):**
          Trainer schlägt auf den Zuspieler. Zuspieler wehrt ab, Mitspieler von Pos IV übernimmt das Zuspiel.

          * **U13 (3v3):** Läufer startet von hinten (Pos I) und läuft nach Pos III ein.
          * **U14 (4v4):** Zuspieler lässt sich aus Pos II/I in die Abwehr fallen und wird vertreten.
      - icon: 👀
        phase: Das Scanner-Zuspiel
        dauer: 20
        inhalt: '**Block lesen:** Trainer hebt linke oder rechte Hand. Zuspieler auf Pos III pritscht dorthin, wo die Hand *unten* ist.'
      - icon: 🌪️
        phase: Der Dauerläufer
        dauer: 20
        inhalt: |-
          **Laufwege & Beinarbeit automatisieren:**

          * Sprint Pos I -> Pos III -> Zuspiel auf Pos IV. Zurück zu Pos I. 8x am Stück wiederholen.
      - icon: 🏆
        phase: 'Spielform: Der Libero-Joker'
        dauer: 20
        inhalt: '**3v3 / 4v4 Match:** Ein Spieler sichert auf der Grundlinie (hinter Pos I und IV) ab und rettet Notbälle.'
