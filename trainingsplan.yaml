        dauer: 20
        titel: 3:3 Kontakt-Bonus
        bild: bilder/3v3-kontakt.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Kleinfeld.

          * Punkt zählt 2, wenn alle drei Spieler den Ball berührt haben.
          * Einsteiger dürfen den ersten Ball fangen.

          **Trainer-Details:** Der Bonus bringt Starke dazu, Schwächere einzubinden statt alles selbst zu spielen.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 3:3 Turnier (Kurzspiele)
        bild: bilder/3v3-turnier.svg
        inhalt: |-
          **Ablauf:** Teams für heute fest, Spiele auf Zeit (5 Minuten), danach Gegner wechseln.

          * Aufschlag von unten oder oben nach Wahl.
          * Stufen-Regeln wie in TE 5.

          **Trainer-Details:** Spielstände notieren. Fair-Play-Punkt für das Team, das am lautesten kommuniziert.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Nächste Woche ist Check-Woche. Jedes Kind wählt sein Aufschlag-Ziel.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
