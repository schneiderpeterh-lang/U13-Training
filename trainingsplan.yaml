          **Ablauf:** Alle an der Grundlinie, Anlauf bis zur 3-m-Linie, zurückgehen, wieder anlaufen. Danach Ball-Aufgaben.

          * 🟢 2-Schritt-Anlauf (Rechtshänder: links – rechts-links), beidbeiniger Absprung.
          * 🔵 3-Schritt-Anlauf mit Armschwung nach hinten und hoch.
          * 🔴 4-Schritt-Anlauf, Landung beidbeinig, stabil, nicht ins Netz.
