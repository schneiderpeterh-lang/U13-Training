        achte_auf: 'Wie reagieren die Kinder auf eigene Fehler und Fehler der anderen? Gewünscht ist kurz abklatschen und weiterspielen, ohne Meckern und ohne Kopf hängen lassen.'
        sag_dazu: 'Abklatschen, nächster Ball!'
