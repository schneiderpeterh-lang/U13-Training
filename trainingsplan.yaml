# Trainingsplan 3 Monate – RTK-Spielreihe & Basics (U13)
#
# Gleiches Format wie trainingsplan.yaml (monate -> wochen -> einheiten -> uebungen).
# Zum Benutzen: diese Datei als trainingsplan.yaml neben die App legen, oder die
# Einträge unter "monate:" an die bestehende trainingsplan.yaml anhängen.
#
# Leitideen (DVV-Rahmentrainingskonzeption, RTK, und Best Practice Jugendvolleyball):
#   * Spielgemäß lernen: Spielreihe 1:1 -> 2:2 -> 3:3 -> 4:4 auf Kleinfeldern,
#     jede Einheit endet mit Spielen.
#   * Viele Ballkontakte: höchstens 2-3 Kinder pro Ball, kurze Reihen, keine Wartezeit
#     über 30 Sekunden, Wartende werfen zu, zählen oder holen Bälle.
#   * Basics zuerst: Pritschen und Baggern (Monat 1), Aufschlag, Annahme, Zuspiel
#     (Monat 2), Angriff und Abwehr (Monat 3). Jede Woche wird Gelerntes wiederholt.
#   * Differenzierung in drei Stufen, die Kinder wählen selbst und steigen auf:
#       🟢 Stufe 1 = Einsteiger   🔵 Stufe 2 = Mittel   🔴 Stufe 3 = Fortgeschrittene
#   * Woche 4 jedes Monats: Basics-Abzeichen (Kontakte zählen) und Turnier.
#   * Netz 2,00-2,15 m oder Leine; Feldgrößen sind Richtwerte.
# "varianten" passen eine Übung an die Anzahl anwesender Spieler an (wie in der App).
# Optional pro Übung, für Bilder und Videos:
#   bild: bilder/datei.svg      (Skizze oder Foto im Ordner "bilder", oder ein https-Link)
#   video: https://youtu.be/... (YouTube-Link oder eigenes Video im Ordner "bilder")
#   link: https://...           (Quelle zum Nachlesen, z. B. eine Übung auf einer Trainerseite)

monate:
- name: Monat 1
  thema: 'Pritschen & Baggern: den Ball kontrollieren (Spielreihe 1:1 → 2:2)'
  titel: Ballkontrolle im Kleinfeld
  wochen:
  - name: Woche 1
    einheiten:
    - name: TE 1
      dauer: 90
      titel: 'Pritschen: Ball über die Stirn'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball über Kopf hochwerfen und mit Pritschbewegung wieder nach oben drücken, ohne zu fangen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: ✋
        phase: Handhaltung
        dauer: 10
        titel: Körbchen bauen
        bild: bilder/handhaltung-merkbild.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Trainer steht vorn und macht vor. Vier kurze Aufgaben à 2 Minuten, noch ohne in die Luft zu pritschen.

          * **Fenster:** Daumen und Zeigefinger bilden ein Dreieck. Durch das Fenster den Trainer anschauen und die Hände eine Faust breit vor die Stirn nehmen.
          * **Handabdruck:** Ball liegt vor den Füßen. Hände von oben auf den Ball legen, alle 10 Finger weit gespreizt. In genau dieser Form den Ball aufheben und über die Stirn führen, ohne die Finger zu verschieben.
          * **Ball ins Körbchen fallen lassen:** Ball mit gestreckten Armen über den Kopf halten, loslassen und im Körbchen über der Stirn auffangen. Leise fangen: Finger und Handgelenke geben nach, Ellbogen gehen zur Seite.
          * **„Körbchen!“:** Alle prellen frei durch die Halle. Auf Zuruf sofort Ball über die Stirn und einfrieren. Trainer geht herum und prüft.
          * 🟢 Mit Softball oder Luftballon, der Ball kommt langsam und die Hände haben Zeit.
          * 🔵 Ball aus 50 cm über dem Kopf fallen lassen, fangen, 3 Sekunden halten.
          * 🔴 Ball 1 m hochwerfen, im Körbchen fangen und sofort ganz kurz zurückdrücken (nur Finger und Handgelenke).

          **Trainer-Details:** **Die 3 Merkpunkte (Körbchen):** 1. Daumen zeigen zur Nase, nicht nach vorn. 2. Finger weit gespreizt, nur die Finger berühren den Ball, die Handflächen bleiben frei. 3. Hände eine Faust breit über und vor der Stirn, Ellbogen schräg nach außen. Typische Fehler: Handflächen am Ball (es klatscht), Daumen zeigen nach vorn (Ball rutscht durch), Finger geschlossen, Hände vor dem Gesicht statt über der Stirn. Lieber ein Kind kurz in die richtige Form „modellieren“ als lange erklären.
        varianten:
          6-8: Trainer korrigiert jedes Kind einzeln mit den Händen am Ball.
          9-12: 'Paare: eines macht die Aufgabe, eines prüft die 3 Merkpunkte, nach jeder Aufgabe wechseln.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Bonus: Wer schafft es, beim Pritschen langsam in die Hocke und wieder hoch zu gehen?

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: 'Pritschen im Paar: Werfen – Pritschen'
        bild: bilder/pritschen-paar.svg
        inhalt: |-
          **Ablauf:** Paare, 3 m Abstand. A wirft hoch zu B, B pritscht zurück. Nach 10 Würfen wechseln.

          * 🟢 B fängt über der Stirn und drückt sofort zurück (kein Ausholen).
          * 🔵 B pritscht direkt zurück, A fängt. Ziel: 10 von 10 fangbar.
          * 🔴 Durchgehend pritschen, 4 m Abstand. Ziel: 20 in Folge.

          **Trainer-Details:** Unter den Ball laufen, **vor** dem Kontakt stehen. Zielt auf Stirnhöhe des Partners.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 Pritschen über die Leine
        bild: bilder/1v1-leine.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Ball wird von oben eingeworfen. Punkt, wenn der Ball im gegnerischen Feld den Boden berührt.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 1:1
        bild: bilder/kaiser-1v1.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (1:1). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Gespielt wird mit den Regeln aus der Spielform; jedes Kind wählt seine Stufe.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Hausaufgabe: 5 Minuten zuhause Fang-Pritschen oder Pritschen gegen die Wand.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 2
      tag: Freitag
      dauer: 120
      titel: 'Baggern: das Brett bauen'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Ball-Retter
        bild: bilder/ball-retter.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Wer einen Ball in Pritschhaltung über dem Kopf hält, kann nicht gefangen werden. Es gibt nur halb so viele Bälle wie Kinder: Ball an Mitspieler weiterwerfen, um sie zu retten.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Baggern allein (Brett bauen)
        bild: bilder/baggern-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Erst 1 Minute Brett zeigen: Hände ineinander, Daumen parallel, Arme gestreckt, Schultern nach vorn.

          * 🟢 Ball aus 1 m auf das Brett fallen lassen, hochspringen lassen, fangen. Ziel: 10x sauber.
          * 🔵 Bagger über dem Kopf, Ball mind. auf Kopfhöhe. Ziel: 15 in Folge.
          * 🔴 Wechsel Bagger – Pritsche – Bagger. Ziel: 20 in Folge.
          * Bonus: Ball auf dem Brett 5 Sekunden balancieren, ohne dass er runterfällt.

          **Trainer-Details:** Arme bleiben fast still, gespielt wird aus den Beinen. Ball trifft die Unterarme oberhalb der Handgelenke.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: 'Baggern im Paar: Zuwurf – Bagger'
        bild: bilder/baggern-paar.svg
        inhalt: |-
          **Ablauf:** Paare, 3–4 m Abstand. A wirft von unten auf den Bauch von B, B baggert zurück. 10 Würfe, dann Wechsel.

          * 🟢 Ball darf einmal aufspringen, dann baggern.
          * 🔵 Direkt baggern, A soll ohne Schritt fangen können.
          * 🔴 A wirft 1 Schritt links/rechts, B macht Sidestep, stoppt und baggert.

          **Trainer-Details:** Erst stehen, dann spielen! Brett früh bilden, Schultern zum Partner drehen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: 'Pritschen-Wiederholung: Selbstpass und Pass'
        bild: bilder/selbstpass-pass.svg
        inhalt: |-
          **Ablauf:** Paare, 3–4 m Abstand, ein Ball.

          * Vorab 2 Minuten Körbchen-Check: Ball über der Stirn einfrieren, der Partner prüft die 3 Merkpunkte.
          * 🟢 Fangen – hochwerfen – pritschen zum Partner.
          * 🔵 Selbstpass pritschen, dann zum Partner.
          * 🔴 Selbstpass baggern, dann zum Partner pritschen.

          **Trainer-Details:** Der Selbstpass gibt Zeit, unter den Ball zu kommen. Er wird später im 1:1 und 2:2 gebraucht.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 mit zwei Kontakten
        bild: bilder/1v1-zwei-kontakte.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Jeder Ball wird zweimal gespielt: erst Bagger oder Pritsche zu sich selbst, dann rüber.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 25
        titel: 2:2 Fang-Volleyball
        bild: bilder/2v2-fang.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Annahme: Ball wird gefangen und zum Partner geworfen, Partner pritscht oder wirft (aus Pritschhaltung) rüber.
          * 🟢 Beide Kontakte dürfen gefangen werden.
          * 🔵 Nur der 1. Kontakt darf gefangen werden.
          * 🔴 Kein Fangen; 2. Kontakt muss gepritscht werden.
          * Spiele auf 7 Punkte, Gewinner rotiert ein Feld weiter.

          **Trainer-Details:** Teams in jedem Feld dürfen ihre Stufe gemeinsam wählen. Bei langen Ballwechseln laut loben.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Kurze Frage an die Gruppe: Wann pritsche ich, wann baggere ich? (hoch = pritschen, unter Brust = baggern)

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 2
    einheiten:
    - name: TE 3
      dauer: 90
      titel: Unter den Ball laufen
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball hochwerfen, 3 Schritte laufen, umdrehen, Ball über der Stirn fangen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: ✋
        phase: Handhaltung
        dauer: 10
        titel: 'Fingerpritschen: Rückenlage, Sitzen, Wand'
        bild: bilder/handhaltung-boden-wand.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Drei Positionen à 3 Minuten, in jeder Position laut mitzählen. Die Beine sind ausgeschaltet, so arbeiten nur Finger und Handgelenke.

          * **Rückenlage:** Auf dem Rücken liegen, Ball über der Stirn. Ball senkrecht 30–50 cm hochpritschen und wieder im Körbchen abfedern.
          * **Im Sitzen:** Grätschsitz, Ball senkrecht über den Kopf pritschen. Rücken gerade, Blick zum Ball.
          * **Wand-Trommel:** 50 cm vor der Wand stehen, Ball in Stirnhöhe ganz schnell und kurz gegen die Wand tippen. 30 Sekunden zählen.
          * 🟢 Rückenlage: jeden Ball kurz fangen und wieder hochdrücken. Ziel: 10 in Folge.
          * 🔵 Durchgehend pritschen. Ziel: 20 in Folge, Wand-Trommel 30 in 30 Sekunden.
          * 🔴 Ball bis 1 m hoch, oder Wand-Trommel mit einem Schritt mehr Abstand. Ziel: 30 in Folge.

          **Trainer-Details:** Hörtest: Ein guter Pritschball ist fast leise. Klatscht es, sind die Handflächen am Ball. **Die 3 Merkpunkte (Körbchen):** 1. Daumen zeigen zur Nase, nicht nach vorn. 2. Finger weit gespreizt, nur die Finger berühren den Ball, die Handflächen bleiben frei. 3. Hände eine Faust breit über und vor der Stirn, Ellbogen schräg nach außen.
        varianten:
          6-8: Alle gleichzeitig, Trainer zählt die Wand-Trommel laut mit.
          9-12: 'Zwei Gruppen: eine an der Wand, eine am Boden, nach 3 Minuten wechseln, damit die Wand reicht.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Neu: Pritschen im Gehen durch die Halle, ohne dass der Ball fällt.

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Pritschen nach Laufen
        bild: bilder/pritschen-laufen.svg
        inhalt: |-
          **Ablauf:** Paare, 4 m Abstand. A wirft kurz, lang, links oder rechts. B läuft hin, stoppt in Schrittstellung, pritscht zurück.

          * 🟢 Ein Schritt in eine Richtung, Ball wird hoch geworfen.
          * 🔵 2–3 Schritte, alle Richtungen.
          * 🔴 A pritscht statt zu werfen; durchgehend spielen, 15 in Folge.

          **Trainer-Details:** Rechter Fuß leicht vorn, Körper zum Ziel drehen **bevor** der Ball kommt. Nicht unter dem Ball „stochern“.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 mit Bewegung
        bild: bilder/1v1-bewegung.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Wer den Ball rüberspielt, muss danach die Grundlinie berühren.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 1:1
        bild: bilder/kaiser-1v1.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (1:1). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Kaiserfeld: Ball muss mindestens 2 m hoch über die Leine.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat seine Stufe von letzter Woche verbessert?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 4
      tag: Freitag
      dauer: 120
      titel: Baggern zur Seite und nach vorn
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Brücken-Fangen
        bild: bilder/bruecken-fangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Gefangene stellen sich breitbeinig in Grundstellung hin und zeigen das Bagger-Brett. Befreit wird, wer von einem Mitspieler einen Ball aufs Brett geworfen bekommt und ihn zurückbaggert.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Baggern allein (Brett bauen)
        bild: bilder/baggern-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Erst 1 Minute Brett zeigen: Hände ineinander, Daumen parallel, Arme gestreckt, Schultern nach vorn.

          * 🟢 Ball aus 1 m auf das Brett fallen lassen, hochspringen lassen, fangen. Ziel: 10x sauber.
          * 🔵 Bagger über dem Kopf, Ball mind. auf Kopfhöhe. Ziel: 15 in Folge.
          * 🔴 Wechsel Bagger – Pritsche – Bagger. Ziel: 20 in Folge.
          * Neu: Baggern im langsamen Gehen vorwärts und seitwärts.

          **Trainer-Details:** Arme bleiben fast still, gespielt wird aus den Beinen. Ball trifft die Unterarme oberhalb der Handgelenke.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Bagger aus Bewegung
        bild: bilder/bagger-bewegung.svg
        inhalt: |-
          **Ablauf:** Paare, 4 m Abstand. A wirft 1–3 Schritte vor, links oder rechts von B. B läuft, stoppt, baggert zurück.

          * 🟢 Nur nach vorn, Ball kommt hoch.
          * 🔵 Vorn, links, rechts im Wechsel.
          * 🔴 A baggert statt zu werfen, durchgehend 15 in Folge.

          **Trainer-Details:** Beim Ball zur Seite: Brett schräg stellen (äußere Schulter tiefer), damit der Ball zum Partner zurück geht.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: '3er-Dreieck: Bagger – Pritsche – Fangen'
        bild: bilder/dreieck-bpf.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen im Dreieck, 4 m Abstand. A wirft zu B, B baggert zu C, C pritscht zu A.

          * 🟢 C fängt und wirft weiter.
          * 🔵 Alle Kontakte gespielt; nach 10 Bällen Positionen wechseln.
          * 🔴 Ohne Werfen: durchgehend spielen, 10 Runden in Folge.

          **Trainer-Details:** Das ist schon der Ablauf aus dem Spiel: Annahme – Zuspiel. Ziel: Bagger hoch zu C (über Kopfhöhe).
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 Baggerduell
        bild: bilder/1v1-baggerduell.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Rüber geht es nur mit dem Bagger. Selbstpass darf gepritscht werden.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 25
        titel: 2:2 mit Pflichtpass
        bild: bilder/2v2-pflichtpass.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Jedes Team muss den Ball mindestens zweimal spielen, einmal davon zum Partner.
          * 🟢 1. Kontakt darf gefangen werden.
          * 🔵 Kein Fangen.
          * 🔴 Drei Kontakte Pflicht (Bagger – Pritsche – rüber).
          * Spiele auf 7, danach Gegner wechseln.

          **Trainer-Details:** Gemischte Paare (stark + schwächer) bilden. Punkt zählt doppelt, wenn das schwächere Kind den Ball rüberspielt.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Hausaufgabe: Baggern gegen eine Hauswand, 3x 2 Minuten.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 3
    einheiten:
    - name: TE 5
      dauer: 90
      titel: Pritschen mit Richtungswechsel
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball hochwerfen, halbe Drehung, fangen. Danach: Ball nach hinten über den Kopf werfen und unter den Ball drehen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: ✋
        phase: Handhaltung
        dauer: 10
        titel: Freeze-Fangen im Paar
        bild: bilder/handhaltung-freeze.svg
        inhalt: |-
          **Ablauf:** Paare, 3 m Abstand. A wirft den Ball hoch auf die Stirn von B. B fängt im Körbchen und friert ein. A prüft die 3 Merkpunkte und gibt Daumen hoch, dann drückt B den Ball aus der Haltung zurück. Nach 10 Würfen wechseln.

          * 🟢 Fangen, 2 Sekunden einfrieren, zurückdrücken.
          * 🔵 Nur noch ganz kurz fangen, sofort zurückdrücken. Auf Zuruf „Freeze!“ von A trotzdem einfrieren.
          * 🔴 Direkt pritschen, aber bei jedem 5. Ball ruft A „Freeze!“ und B muss den Ball im Körbchen festhalten.
          * Zusatz für Kräftige: Mit Basketball oder weichem Medizinball (höchstens 1 kg) nur fangen und zurückdrücken, kein Pritschen in der Luft. Der schwere Ball zwingt die Finger auseinander.

          **Trainer-Details:** Das Prüfen macht die Partner zu Mini-Trainern und schärft den Blick für die eigene Haltung. **Die 3 Merkpunkte (Körbchen):** 1. Daumen zeigen zur Nase, nicht nach vorn. 2. Finger weit gespreizt, nur die Finger berühren den Ball, die Handflächen bleiben frei. 3. Hände eine Faust breit über und vor der Stirn, Ellbogen schräg nach außen.
        varianten:
          6-8: Trainer übernimmt bei einem Paar das Werfen und Prüfen, damit jedes Kind einmal direkt korrigiert wird.
          9-12: '3er-Gruppen bei Ballmangel: einer wirft, einer fängt, einer prüft. Nach 10 Würfen rotieren.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Neu: Pritschen mit Vierteldrehung nach jedem Kontakt (Ball bleibt am Platz).

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Pritschen im Dreieck
        bild: bilder/dreieck-pritschen.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen im Dreieck, 3–4 m Abstand, Ball läuft im Uhrzeigersinn, nach 1 Minute gegen den Uhrzeigersinn.

          * 🟢 Fangen – drehen – zum Nächsten pritschen.
          * 🔵 Direkt pritschen, Körper zum Ziel drehen.
          * 🔴 Zusätzlich Selbstpass vor jedem Weiterspielen; Ziel 15 Runden ohne Fehler.

          **Trainer-Details:** Zum Ziel drehen, **bevor** der Ball ankommt. Wer sich während des Kontakts dreht, spielt ungenau.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 diagonal
        bild: bilder/1v1-diagonal.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Feld wird diagonal geteilt; Punkt zählt doppelt, wenn der Ball in der Ecke (Reifen/Markierung) landet.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: 2:2 Königsfeld
        bild: bilder/2v2-koenigsfeld.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Ein Königsfeld, Herausforderer-Teams warten hinten (max. 1 Team).
          * Herausforderer schlagen von unten ein. Holen sie den Punkt, sind sie König.
          * Königsteam muss 3 Punkte in Folge machen, um einen Bonuspunkt zu bekommen.
          * 🟢/🔵/🔴 wie in der letzten Woche, jedes Team wählt.

          **Trainer-Details:** Schnelle Wechsel, kurze Ballwechsel, hoher Spaß. Bei 9–12 Kindern lieber 2 Königsfelder.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Nächste Woche ist Check-Woche: Jeder überlegt, welche Stufe er schaffen will.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 6
      tag: Freitag
      dauer: 120
      titel: Pritschen und Baggern im Wechsel
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Kettenfangen mit Ball
        bild: bilder/kettenfangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Die Fänger-Kette darf nur fangen, solange sie sich einen Ball zupritscht oder zuwirft (aus Pritschhaltung).
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Baggern allein (Brett bauen)
        bild: bilder/baggern-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Erst 1 Minute Brett zeigen: Hände ineinander, Daumen parallel, Arme gestreckt, Schultern nach vorn.

          * 🟢 Ball aus 1 m auf das Brett fallen lassen, hochspringen lassen, fangen. Ziel: 10x sauber.
          * 🔵 Bagger über dem Kopf, Ball mind. auf Kopfhöhe. Ziel: 15 in Folge.
          * 🔴 Wechsel Bagger – Pritsche – Bagger. Ziel: 20 in Folge.
          * Neu: Bagger hoch – Ball fällt auf Boden – aufspringen lassen – wieder baggern.

          **Trainer-Details:** Arme bleiben fast still, gespielt wird aus den Beinen. Ball trifft die Unterarme oberhalb der Handgelenke.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Wechselspiel Pritsche/Bagger
        bild: bilder/wechselspiel.svg
        inhalt: |-
          **Ablauf:** Paare, 4 m Abstand. A spielt abwechselnd hoch (Pritschball) und kurz/tief (Baggerball).

          * 🟢 A wirft, B entscheidet: hoch = Pritsche, tief = Bagger.
          * 🔵 A pritscht und baggert, B spielt zurück.
          * 🔴 Durchgehend, ohne Fangen, 20 in Folge.

          **Trainer-Details:** Entscheidung früh treffen. Häufiger Fehler: Pritschball wird gebaggert, weil die Beine zu spät kommen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: 'Ball über die Leine: Paar gegen Paar kooperativ'
        bild: bilder/2v2-kooperativ.svg
        inhalt: |-
          **Ablauf:** Zwei Paare spielen sich über eine Leine den Ball zu, **ohne** Punkte. Jede Seite 2 Kontakte.

          * 🟢 1. Kontakt fangen erlaubt.
          * 🔵 Kein Fangen, 10 Überquerungen in Folge.
          * 🔴 3 Kontakte pro Seite, 10 Überquerungen.

          **Trainer-Details:** Kooperativ heißt: Ziel ist ein langer Ballwechsel. Das gibt Einsteigern viele Kontakte ohne Druck.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 Wahlweise
        bild: bilder/1v1-wahlweise.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Ball darf mit Bagger oder Pritsche rüber; ein Kontakt muss Bagger sein.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 25
        titel: 2:2 Turnier „Jeder gegen jeden“
        bild: bilder/2v2-turnier.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Feste Paare für heute, jeder spielt einmal gegen jedes andere Paar, 4 Minuten pro Spiel.
          * Stufen wie in Woche 2. Ein Punkt Bonus für einen Ballwechsel mit mehr als 6 Kontakten.

          **Trainer-Details:** Paare mischen (stark + schwächer). Spielstände an der Wand notieren, Sieger am Ende ehren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Hausaufgabe: Den eigenen Pritsch- und Baggerrekord zuhause probieren.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 4
    einheiten:
    - name: TE 7
      dauer: 90
      titel: 'Check-Woche: Basics-Abzeichen'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Alle Aufgaben aus dem Monat einmal wiederholen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🎯
        phase: Technik I
        dauer: 25
        titel: Basics-Abzeichen Pritschen & Baggern
        bild: bilder/abzeichen-stationen.svg
        inhalt: |-
          **Ablauf:** Stationen mit je einem Kind als Zähler. Jedes Kind hat 2 Versuche pro Station. Ergebnis auf eine Liste.

          * Vorab 2 Minuten Körbchen-Check: Ball über der Stirn einfrieren, der Partner prüft die 3 Merkpunkte.
          * Station 1: Pritschen allein über Kopf (in Folge).
          * Station 2: Baggern allein über Kopf (in Folge).
          * Station 3: Pritschen gegen die Wand aus 2 m (in Folge).
          * Station 4: Paar-Bagger, 10 Zuwürfe, wie viele kommen fangbar zurück?
          * 🟢 Abzeichen: 10 / 🔵 Abzeichen: 20 / 🔴 Abzeichen: 30 (Stationen 1–3).

          **Trainer-Details:** Kein Wettkampf gegeneinander, sondern gegen den eigenen Rekord. Die Liste ist die Grundlage für die Stufen im nächsten Monat.
        varianten:
          6-8: Zwei Kinder pro Station, eines spielt, eines zählt.
          9-12: Drei Kinder pro Station, rotieren nach jedem Durchgang.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Lücken schließen
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Freie Übungszeit in Paaren: Jedes Kind übt die Station, die ihm am schwersten fiel.

          * Trainer geht herum und korrigiert genau **einen** Punkt pro Kind.

          **Trainer-Details:** Individuelles Feedback ist hier wichtiger als ein neues Spiel.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 35
        titel: Kaiserturnier 2:2
        bild: bilder/kaiser-2v2.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (2:2). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Regeln aus Woche 3; im Kaiserfeld kein Fangen.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Abzeichen verkünden und loben.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 8
      tag: Freitag
      dauer: 120
      titel: Monatsturnier 2:2
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Ball-Retter (Lieblingsspiel)
        bild: bilder/ball-retter.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Wie in Woche 1: Wer den Ball in Pritschhaltung über dem Kopf hält, ist sicher.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Einspielen im Paar
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare, freies Einspielen: 3 Minuten Pritschen, 3 Minuten Baggern, 3 Minuten Wechsel, dann über die Leine.

          **Trainer-Details:** Wie vor einem echten Spiel. Kinder sollen den Ablauf lernen, sich selbst einzuspielen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Kooperativ-Rekord über die Leine
        bild: bilder/2v2-kooperativ.svg
        inhalt: |-
          **Ablauf:** Zwei Paare über die Leine, ohne Punkte: Wie viele Überquerungen schafft ihr? Drei Durchgänge, der beste zählt.

          * 🟢 1. Kontakt fangen erlaubt. 🔵 Kein Fangen. 🔴 3 Kontakte pro Seite.

          **Trainer-Details:** Hallenrekord an die Tafel schreiben – im nächsten Monat wird er geknackt.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 60
        titel: Monatsturnier 2:2
        bild: bilder/2v2-turnier.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Gemischte, ausgeloste Paare. Gruppenphase (jeder gegen jeden, 5 Minuten), dann Platzierungsspiele.
          * Jedes Paar wählt vor jedem Spiel seine Stufe; Stufe 🔴 gibt bei Sieg 1 Zusatzpunkt.
          * Pausierende Paare pfeifen und zählen.

          **Trainer-Details:** Kinder schiedsrichtern lassen: Sie lernen Regeln und bleiben aktiv.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 15
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Monatsrückblick: Was kann ich jetzt, was ich vor 4 Wochen nicht konnte? Siegerehrung.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
- name: Monat 2
  thema: 'Aufschlag, Annahme & Zuspiel: das Drei-Kontakte-Spiel im 2:2 und 3:3'
  titel: Drei Kontakte
  wochen:
  - name: Woche 1
    einheiten:
    - name: TE 1
      dauer: 90
      titel: Aufschlag von unten
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball mit einer Hand von unten gegen die Wand schlagen, fangen (Aufschlag-Gefühl).

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: Pritschen aus den Beinen
        bild: bilder/pritschen-beine.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Drei Aufgaben, Trainer zählt laut mit.

          * **Hocke und hoch (3 Min):** Ball im Körbchen über der Stirn, tief in die Knie. Beine strecken und den Ball aus dem Körbchen senkrecht hochdrücken, wieder fangen. Die Arme strecken erst, wenn die Beine schon arbeiten.
          * **Höhen-Treppe (4 Min):** Pritschen allein. Trainer ruft „1!“, „2!“ oder „3!“ für 1 m, 2 m oder 3 m Ballhöhe. Höher wird es durch mehr Beine, nicht durch mehr Arme.
          * **Schrittstellung (3 Min):** Rechter Fuß eine halbe Fußlänge vor. 10 Pässe gegen die Wand aus 3 m, jeder Pass mit Strecken bis auf die Zehenspitzen.
          * 🟢 Hocke und hoch mit Fangen bei jeder Aufgabe, Treppe nur 1 m und 2 m.
          * 🔵 Durchgehend pritschen. Ziel: 3 Treppen-Runden (1 – 2 – 3 m) ohne Fehler.
          * 🔴 Wand aus 4 m, oder abwechselnd Hocke (tiefer Ball) und Strecken (hoher Ball).

          **Trainer-Details:** Ganzkörperbewegung: Beine, Rumpf und Arme strecken in einer Welle in Spielrichtung. Gute Pritscher landen nach dem Pass auf den Zehenspitzen. Die Handhaltung bleibt wie gelernt (Körbchen über der Stirn).
        varianten:
          6-8: Alle gleichzeitig, Trainer macht die Höhen-Treppe vor und zählt.
          9-12: 'Zwei Gruppen: eine an der Wand, eine frei in der Halle, nach 5 Minuten wechseln.'
      - icon: 🎯
        phase: Technik I
        dauer: 5
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Kurz-Wiederholung: Jeder versucht seinen Abzeichen-Rekord zu verbessern.

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik I
        dauer: 20
        titel: Aufschlag von unten mit Ziel
        bild: bilder/aufschlag-ziel.svg
        inhalt: |-
          **Ablauf:** Paare an beiden Seiten des Netzes (bzw. Leine), je ein Ball pro Paar. Aufschlag aus der Distanz, die zur Stufe passt.

          * 🟢 Aufschlag von unten aus 4–5 m Entfernung vom Netz.
          * 🔵 Aufschlag von unten aus 6–7 m.
          * 🔴 Aufschlag von unten von der Grundlinie, oder Einstieg Aufschlag von oben (Tennisaufschlag) aus 6 m.
          * Ziel: Partner auf der anderen Seite soll den Ball fangen können, ohne mehr als einen Schritt zu machen.

          **Trainer-Details:** Ball ruhig in der Hand halten, nicht hochwerfen. Schlagarm pendelt gerade nach vorn, Gewicht auf den vorderen Fuß. Wer 8 von 10 trifft, geht 1 m zurück.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme zum Zuspieler
        bild: bilder/annahme-zuspieler.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: A schlägt von unten auf (oder wirft über das Netz), B nimmt mit Bagger an, C steht als Zuspieler am Netz und fängt.

          * 🟢 A wirft über das Netz, Annahme darf einmal aufspringen.
          * 🔵 A schlägt von unten auf, B nimmt direkt an.
          * 🔴 C pritscht den angenommenen Ball zu B zurück, B fängt.
          * Nach 6 Bällen rotieren: A → B → C → A.

          **Trainer-Details:** Annahme hoch und in Richtung Netzmitte (Pos III). Lieber zu hoch als zu flach.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 2:2 mit Aufschlag
        bild: bilder/2v2-aufschlag.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Jeder Ballwechsel beginnt mit Aufschlag von unten (Distanz nach Stufe).
          * Aufschlagfehler: Aufschläger darf einmal wiederholen (2. Chance).
          * 🟢 1. Kontakt fangen erlaubt. 🔵 Kein Fangen. 🔴 Drei Kontakte Pflicht.

          **Trainer-Details:** Die „2. Chance“ sorgt dafür, dass das Spiel läuft und Einsteiger nicht frustriert sind.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat 8 von 10 Aufschlägen getroffen?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 2
      tag: Freitag
      dauer: 120
      titel: 'Annahme: hoch zur Mitte'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Aufschlag-Fangen
        bild: bilder/fang-aufschlag.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Die Fänger dürfen nur fangen, wenn sie dabei einen Ball von unten (Aufschlagbewegung) prellen. Geht auch mit Softball.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Bagger-Brett: Hände, Arme, Beine'
        bild: bilder/bagger-merkbild.svg
        inhalt: |-
          **Ablauf:** Paare mit einem Ball. Baggern können die Kinder seit Monat 1, jetzt wird das Brett genau. Trainer macht jede Aufgabe einmal vor, dann 2 Minuten üben, dann wechseln.

          * **Brett in 1 Sekunde:** Alle laufen locker. Auf „Brett!“ sofort stehen bleiben, Knie beugen, Brett bilden. Der Partner prüft die 3 Merkpunkte.
          * **Ball tragen:** Ball liegt auf dem Brett. Damit durch die Halle gehen, in die Hocke gehen und wieder hoch, ohne dass der Ball runterfällt.
          * **Treffpunkt finden:** Partner hält den Ball 30 cm über das Brett und lässt ihn fallen. Er soll eine Handbreit über den Handgelenken auftreffen und gerade nach oben springen.
          * **Brett-Schieber:** Partner hält den Ball fest vor dem Bauch des Kindes. Das Kind legt das Brett darunter und schiebt den Ball nur durch Strecken der Beine nach vorn-oben. Die Arme bleiben fest.
          * 🟢 Mit Softball, beim Treffpunkt den Ball nach dem Aufspringen fangen.
          * 🔵 Treffpunkt aus 60 cm, Ball springt zum Partner zurück und wird gefangen.
          * 🔴 Ball tragen im Sidestep und rückwärts, Treffpunkt aus 1 m.

          **Trainer-Details:** **Die 3 Merkpunkte (Brett):** 1. Hand in Hand legen, Daumen liegen parallel nebeneinander. 2. Arme gestreckt, Ellbogen zusammen, so wird das Brett flach. 3. Knie gebeugt, Ball vor dem Körper treffen, gespielt wird aus den Beinen, nicht aus den Armen. Typische Fehler: Daumen über Kreuz, Arme angewinkelt, Ball an den Handgelenken oder Händen, Schwung aus den Schultern. Die Schieber-Aufgabe macht spürbar, dass die Kraft aus den Beinen kommt.
        varianten:
          6-8: Trainer geht von Paar zu Paar und modelliert das Brett mit den Händen.
          9-12: 'Zwei Paare bilden eine Prüf-Gruppe: ein Paar übt, das andere prüft, nach jeder Aufgabe wechseln.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Baggern allein (Brett bauen)
        bild: bilder/baggern-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Erst 1 Minute Brett zeigen: Hände ineinander, Daumen parallel, Arme gestreckt, Schultern nach vorn.

          * 🟢 Ball aus 1 m auf das Brett fallen lassen, hochspringen lassen, fangen. Ziel: 10x sauber.
          * 🔵 Bagger über dem Kopf, Ball mind. auf Kopfhöhe. Ziel: 15 in Folge.
          * 🔴 Wechsel Bagger – Pritsche – Bagger. Ziel: 20 in Folge.
          * Kurz-Wiederholung: Abzeichen-Rekord verbessern.

          **Trainer-Details:** Arme bleiben fast still, gespielt wird aus den Beinen. Ball trifft die Unterarme oberhalb der Handgelenke.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme-Zielwurf
        bild: bilder/annahme-zielwurf.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen ohne Netz: A wirft auf B, B baggert hoch in einen Reifen/zu C (Zuspielerposition).

          * 🟢 Ball wird auf den Bauch geworfen.
          * 🔵 Ball wird 1–2 Schritte seitlich geworfen.
          * 🔴 A spielt von unten auf (Aufschlag aus 6 m).

          **Trainer-Details:** Schultern Richtung Ziel, Brett früh. Ein Punkt für jeden Ball, den C ohne Schritt fangen kann.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: Aufschlag in Zonen
        bild: bilder/aufschlag-zonen.svg
        inhalt: |-
          **Ablauf:** Paare an beiden Seiten des Netzes (bzw. Leine), je ein Ball pro Paar. Aufschlag aus der Distanz, die zur Stufe passt.

          * 🟢 Aufschlag von unten aus 4–5 m Entfernung vom Netz.
          * 🔵 Aufschlag von unten aus 6–7 m.
          * 🔴 Aufschlag von unten von der Grundlinie, oder Einstieg Aufschlag von oben (Tennisaufschlag) aus 6 m.
          * Ziel: Feld in vorne/hinten geteilt. Ansage „kurz“ oder „lang“, dann aufschlagen.

          **Trainer-Details:** Ball ruhig in der Hand halten, nicht hochwerfen. Schlagarm pendelt gerade nach vorn, Gewicht auf den vorderen Fuß. Wer 8 von 10 trifft, geht 1 m zurück.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: Aufschlag gegen Annahme (Mini-Duell)
        bild: bilder/annahme-duell.svg
        inhalt: |-
          **Ablauf:** Auf jedem Kleinfeld: 2 Aufschläger gegen 2 Annehmer + 1 Zuspieler am Netz.

          * Annahme zum Zuspieler, der fängt: 1 Punkt für Annahme-Team.
          * Aufschlag-Ass oder Annahmefehler: 1 Punkt für Aufschläger.
          * Nach 8 Aufschlägen tauschen.

          **Trainer-Details:** Stufen über die Aufschlagdistanz: Aufschläger wählen die Distanz so, dass sie treffen.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 2:2 „Annahme zählt doppelt“
        bild: bilder/2v2-annahme-doppelt.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Normales 2:2 mit Aufschlag.
          * Punkt nach guter Annahme (Partner kann pritschen) zählt doppelt.
          * Stufen wie in TE 1.

          **Trainer-Details:** Damit wird die Annahme belohnt, nicht nur der Punkt.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Merksatz der Woche: „Annahme hoch zur Mitte.“

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 2
    einheiten:
    - name: TE 3
      dauer: 90
      titel: 'Zuspiel: der zweite Ball'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball hochwerfen, darunter laufen, zum Netz drehen und pritschen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Pritschen zum Ziel: erst drehen, dann spielen'
        bild: bilder/pritschen-drehen.svg
        inhalt: |-
          **Ablauf:** 4er-Gruppen. A wirft hoch zu B in der Mitte. Links und rechts von B steht je ein Fänger C. Wenn der Ball oben ist, ruft A „Links!“ oder „Rechts!“. B dreht sich unter dem Ball zum genannten C und pritscht zu ihm. Nach 8 Bällen rotieren.

          * Gesicht und Bauchnabel zeigen beim Pass immer zum Ziel. Erst drehen, dann spielen.
          * 🟢 A ruft schon vor dem Wurf. B darf den Ball fangen, drehen und aus dem Körbchen zu C pritschen.
          * 🔵 Ruf, wenn der Ball oben ist. B pritscht direkt, C fängt ohne Schritt.
          * 🔴 Ruf erst kurz vor dem Kontakt, oder A pritscht statt zu werfen.

          **Trainer-Details:** Das ist die Grundlage fürs Zuspiel: Wer sich nicht zum Ziel dreht, pritscht seitlich und der Ball fliegt schief. Kurze, schnelle Schritte unter den Ball, die Füße zeigen zum Ziel.
        varianten:
          6-8: Eine 4er-Gruppe plus eine 3er-Gruppe; dort ruft der Werfer, und es gibt nur ein Ziel, das wechselt die Seite.
          9-12: Drei 4er-Gruppen gleichzeitig, Fänger wechseln nach jedem Durchgang ins Werfen.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Zuspiel am Netz
        bild: bilder/zuspiel-netz.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: A wirft vom Feldmittelpunkt zum Netz, B (Zuspieler) läuft von rechts hinten nach Pos III und pritscht hoch zu C auf Pos IV, C fängt.

          * 🟢 B fängt über der Stirn, dreht sich zu C und pritscht.
          * 🔵 B pritscht direkt zu C.
          * 🔴 Ziel: Ball 2 m über die Netzkante, 1 m vom Netz entfernt.

          **Trainer-Details:** Zuspieler steht mit der rechten Schulter zum Netz, Gesicht zu Pos IV. Hoher Ball = Zeit für den Angreifer.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme – Zuspiel – Fangen
        bild: bilder/zuspiel-kette.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen am Netz: Trainer/Werfer von der anderen Seite, A nimmt an, B spielt zu, C fängt auf Pos IV.

          * 🟢 Wurf über das Netz, Annahme darf gefangen und zum Zuspieler geworfen werden.
          * 🔵 Volle Kette ohne Fangen.
          * 🔴 C pritscht oder spielt den Ball über das Netz zurück (3. Kontakt).

          **Trainer-Details:** Dies ist der Kern des Volleyballs. Nach 5 Bällen Positionen wechseln.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 15
        titel: 2:2 mit Zuspielerregel
        bild: bilder/2v2-zuspielerregel.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Der 2. Kontakt muss immer ein Pritschball sein.
          * Wer nicht annimmt, spielt zu.
          * 🟢 Zuspiel darf gefangen und geworfen werden. 🔵 Pritsche Pflicht. 🔴 3 Kontakte Pflicht.

          **Trainer-Details:** Laut rufen: „Ich!“ bei der Annahme, „Hier!“ beim Zuspieler.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 2:2
        bild: bilder/kaiser-2v2.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (2:2). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Kaiserfeld: Drei Kontakte Pflicht.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat heute die meisten Zuspiele gemacht?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 4
      tag: Freitag
      dauer: 120
      titel: Drei Kontakte im 2:2
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Pritsch-Staffel
        bild: bilder/pritsch-staffel.svg
        inhalt: |-
          **Ablauf:** Gruppen à 3 Kinder an der Grundlinie, Hütchen bei 9 m. Danach 3 Minuten Mobilisation.

          * Runde 1: Ball über der Stirn in Pritschhaltung tragen, ums Hütchen, zurück.
          * Runde 2: Ball unterwegs 3x hochwerfen und über der Stirn fangen.
          * 🟢/🔵/🔴 Runde 3: Fang-Pritschen, Pritschen im Gehen oder Pritschen im Laufen.

          **Trainer-Details:** Kleine Gruppen, damit niemand lange wartet. Lieber 5 kurze Runden als 2 lange.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Bagger-Beinarbeit: laufen, stoppen, spielen'
        bild: bilder/bagger-beinarbeit.svg
        inhalt: |-
          **Ablauf:** Jedes Kind steht zwischen drei Hütchen (vorn, links, rechts, je 2 m entfernt). Erst ohne Ball, dann mit Partner.

          * **Schattenlauf (3 Min):** Trainer zeigt mit dem Arm eine Richtung. Alle machen 2 Sidesteps (oder 2 Schritte nach vorn), stoppen in der Grundstellung, bilden das Brett und machen eine Baggerbewegung ohne Ball. Zurück in die Mitte.
          * **Spiegeln (3 Min):** Paare gegenüber. A bewegt sich seitlich hin und her und stoppt plötzlich. B spiegelt jede Bewegung und steht im Stopp sofort mit Brett.
          * **Laufen, stoppen, spielen (4 Min):** A wirft den Ball neben ein Hütchen. B läuft hin, stoppt hinter dem Ball und baggert zu A zurück.
          * 🟢 Der Ball darf einmal aufspringen, dann baggern.
          * 🔵 Direkt baggern, A soll ohne Schritt fangen können.
          * 🔴 A zeigt erst im letzten Moment die Richtung (Ball wird spät geworfen), 10 in Folge fangbar.

          **Trainer-Details:** Leitsatz: „Erst stehen, dann spielen.“ Sidesteps flach über den Boden, Füße kreuzen nicht. Beim Stopp sind die Füße schulterbreit, das Gewicht vorn. **Die 3 Merkpunkte (Brett):** 1. Hand in Hand legen, Daumen liegen parallel nebeneinander. 2. Arme gestreckt, Ellbogen zusammen, so wird das Brett flach. 3. Knie gebeugt, Ball vor dem Körper treffen, gespielt wird aus den Beinen, nicht aus den Armen.
        varianten: &id001
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen im Paar mit Netz
        bild: bilder/paar-netz.svg
        inhalt: |-
          **Ablauf:** Paare über das Netz, 2 Kontakte pro Seite (Selbstpass + rüber).

          * 🟢 Selbstpass darf gefangen werden. 🔵 Durchgehend. 🔴 3 Kontakte allein (Bagger – Pritsche – rüber).

          **Trainer-Details:** Das ist die Brücke zum Spiel: kontrollieren, dann spielen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Rund um die Positionen
        bild: bilder/zuspiel-positionen.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: Annahme (Pos V) – Zuspiel (Pos III) – Pass zurück über das Netz (Pos IV). Nach jedem Ball eine Position weiter.

          * 🟢 Werfen über das Netz, jeder Kontakt darf einmal gefangen werden.
          * 🔵 Aufschlag von unten, kein Fangen.
          * 🔴 3. Kontakt muss gezielt in eine Zone gespielt werden.

          **Trainer-Details:** Jedes Kind kommt auf jede Position. Positionsspezialisierung ist in der U13 nicht das Ziel.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: Aufschlag-Challenge
        bild: bilder/aufschlag-challenge.svg
        inhalt: |-
          **Ablauf:** Paare an beiden Seiten des Netzes (bzw. Leine), je ein Ball pro Paar. Aufschlag aus der Distanz, die zur Stufe passt.

          * 🟢 Aufschlag von unten aus 4–5 m Entfernung vom Netz.
          * 🔵 Aufschlag von unten aus 6–7 m.
          * 🔴 Aufschlag von unten von der Grundlinie, oder Einstieg Aufschlag von oben (Tennisaufschlag) aus 6 m.
          * Ziel: 10 Aufschläge, jeder Treffer in die hintere Feldhälfte zählt 2 Punkte, vordere Hälfte 1 Punkt.

          **Trainer-Details:** Ball ruhig in der Hand halten, nicht hochwerfen. Schlagarm pendelt gerade nach vorn, Gewicht auf den vorderen Fuß. Wer 8 von 10 trifft, geht 1 m zurück.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 2:2 nur mit 3 Kontakten
        bild: bilder/2v2-drei-kontakte.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Punkt zählt nur, wenn das Team 3 Kontakte gespielt hat (sonst Wiederholung).
          * 🟢 Ein Kontakt darf gefangen werden.

          **Trainer-Details:** Fehler beim 3-Kontakte-Versuch werden nicht bestraft. Lange Ballwechsel = viele Kontakte.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 3:3 kennenlernen
        bild: bilder/3v3-kennenlernen.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Feld ca. 6 × 6 m pro Seite. Ein Spieler vorn (Zuspieler), zwei hinten.

          * Nach jedem Aufschlagwechsel des eigenen Teams eine Position weiterrotieren.
          * 🟢 Annahme darf gefangen werden. 🔵 Kein Fangen. 🔴 3 Kontakte Pflicht.

          **Trainer-Details:** Erstes Kennenlernen des 3:3 aus der RTK-Spielreihe: Wer ist vorn, wer hinten? Viele kurze Spiele bis 7.
        varianten:
          6-8: Ein Feld 3:3, übrige Kinder spielen 1:1 nebenan und wechseln nach jedem Spiel.
          9-12: Zwei Felder 3:3, Teams gemischt.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Frage: Wer steht im 3:3 vorne und was macht er?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 3
    einheiten:
    - name: TE 5
      dauer: 90
      titel: Aufschlag von oben (Einführung)
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball mit einer Hand hochwerfen (Ballwurf für den Aufschlag), Ball soll vor dem Schlagarm landen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Tiefer Bagger: Knie runter, nicht die Arme'
        bild: bilder/bagger-tief.svg
        inhalt: |-
          **Ablauf:** Paare, 3 m Abstand. A wirft flache Bälle, die B in Kniehöhe oder tiefer erreichen. B spielt mit tiefem Bagger zurück. 10 Würfe, dann wechseln.

          * **Ohne Ball (2 Min):** Ausfallschritt nach vorn, Po tief, Brett flach knapp über dem Boden. 5x links, 5x rechts.
          * **Ball vom Boden:** Ball liegt vor B. B geht in den Ausfallschritt, schiebt das Brett unter den Ball und hebt ihn aus den Beinen hoch zum Partner.
          * **Geworfene tiefe Bälle:** A wirft flach auf die Knie von B.
          * 🟢 Ball wird gerollt, B stoppt ihn im Ausfallschritt mit dem Brett und spielt ihn hoch.
          * 🔵 Flacher Wurf auf die Knie, B baggert zurück zu A.
          * 🔴 A wirft 1–2 Schritte vor B. B läuft, geht tief und baggert. Ziel: 7 von 10 fangbar.

          **Trainer-Details:** Bei tiefen Bällen bücken sich Kinder mit geraden Beinen und schlagen mit den Armen. Dann fliegt der Ball nach hinten weg. Merksatz: „Knie runter, nicht die Arme.“ Das Brett bleibt flach, der Rücken eher gerade. **Die 3 Merkpunkte (Brett):** 1. Hand in Hand legen, Daumen liegen parallel nebeneinander. 2. Arme gestreckt, Ellbogen zusammen, so wird das Brett flach. 3. Knie gebeugt, Ball vor dem Körper treffen, gespielt wird aus den Beinen, nicht aus den Armen.
        varianten: *id001
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Vom Schlagwurf zum Tennisaufschlag
        bild: bilder/tennisaufschlag.svg
        inhalt: |-
          **Ablauf:** Paare, 6 m Abstand, ohne Netz.

          * 🟢 Schlagwurf: Ball mit einer Hand über Kopf zum Partner werfen, Ellbogen hoch.
          * 🔵 Ball hochwerfen (Hochwurf ca. 50 cm über Kopf) und mit flacher Hand zum Partner schlagen.
          * 🔴 Wie 🔵, aber über das Netz aus 6–7 m, Ziel Zone hinten.

          **Trainer-Details:** Hochwurf vor die Schlagschulter, Treffpunkt vor dem Kopf mit gestrecktem Arm. Wer von oben noch nicht trifft, bleibt beim sicheren Aufschlag von unten im Spiel.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Annahme von oben geschlagenen Bällen
        bild: bilder/annahme-oben.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: A schlägt auf (von unten oder oben nach Stufe), B nimmt an, C fängt als Zuspieler.

          * 🟢 Aufschlag von unten. 🔵 Gemischt. 🔴 Aufschlag von oben, Annahme muss C ohne Schritt erreichen.

          **Trainer-Details:** Annahmespieler steht tief, Gewicht vorne, Brett früh.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 3:3 mit Zuspieler vorn
        bild: bilder/3v3-zuspieler.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Feld ca. 6 × 6 m pro Seite. Der vordere Spieler macht immer das Zuspiel.

          * Annahme von hinten zum Zuspieler, Zuspiel zum hinteren Spieler, der rüberspielt.
          * 🟢 Annahme darf gefangen werden. 🔵 Kein Fangen. 🔴 3. Ball muss geschlagen werden (Schlag aus dem Stand oder Lob).

          **Trainer-Details:** Wenn der Zuspieler annehmen muss, spielt ein Hinterspieler zu. Laut rufen!
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 3:3
        bild: bilder/kaiser-3v3.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (3:3). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Aufschlag wählt jedes Kind selbst (von unten oder oben).
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat seinen ersten Aufschlag von oben über das Netz geschlagen?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 6
      tag: Freitag
      dauer: 120
      titel: 3:3 mit Aufschlag und Annahme
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Zonenfangen
        bild: bilder/zonenfangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Feld ist in 6 Zonen (wie die Positionen) geteilt. Fänger ruft eine Zone, alle müssen dorthin laufen, wer zuletzt kommt, wird Fänger.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Brett kippen: Schultern zum Ziel'
        bild: bilder/bagger-kippen.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen im rechten Winkel. A wirft von der Seite zu B, B baggert nach vorn zu C. C fängt. Nach 8 Würfen Rollen tauschen, danach A auf die andere Seite.

          * Vor dem Ball dreht B die Schultern zu C. Das Brett zeigt zu C, nicht zum Werfer.
          * Bei Bällen von rechts: rechte Schulter etwas tiefer, das Brett kippt zum Ziel. Von links umgekehrt.
          * 🟢 A wirft auf den Bauch von B, kleiner Winkel (C steht schräg vor B).
          * 🔵 Voller rechter Winkel, C soll ohne Schritt fangen können.
          * 🔴 A wirft 1 Schritt neben B. B läuft, stoppt, dreht und baggert. Ziel: 6 von 8 bei C.

          **Trainer-Details:** Der Ball fliegt dahin, wohin das Brett zeigt. Kinder baggern gern zurück zum Werfer, weil sie ihn anschauen. Deshalb: Blick zum Ball, Bauchnabel zum Ziel. **Die 3 Merkpunkte (Brett):** 1. Hand in Hand legen, Daumen liegen parallel nebeneinander. 2. Arme gestreckt, Ellbogen zusammen, so wird das Brett flach. 3. Knie gebeugt, Ball vor dem Körper treffen, gespielt wird aus den Beinen, nicht aus den Armen.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🎯
        phase: Technik II
        dauer: 10
        titel: Einspielen Bagger/Pritsche
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare, freies Einspielen, Trainer gibt Wechsel vor.

          * 🟢/🔵/🔴 nach Abzeichen aus Monat 1.

          **Trainer-Details:** Kurze Wiederholung der Basics; jedes Kind versucht 5 Kontakte mehr als beim Abzeichen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Aufschlag-Serien
        bild: bilder/aufschlag-serien.svg
        inhalt: |-
          **Ablauf:** Paare an beiden Seiten des Netzes (bzw. Leine), je ein Ball pro Paar. Aufschlag aus der Distanz, die zur Stufe passt.

          * 🟢 Aufschlag von unten aus 4–5 m Entfernung vom Netz.
          * 🔵 Aufschlag von unten aus 6–7 m.
          * 🔴 Aufschlag von unten von der Grundlinie, oder Einstieg Aufschlag von oben (Tennisaufschlag) aus 6 m.
          * Ziel: 5 Aufschläge in Folge ohne Fehler. Wer es schafft, wählt eine schwierigere Zone oder Aufschlag von oben.

          **Trainer-Details:** Ball ruhig in der Hand halten, nicht hochwerfen. Schlagarm pendelt gerade nach vorn, Gewicht auf den vorderen Fuß. Wer 8 von 10 trifft, geht 1 m zurück.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme im 3er-Riegel
        bild: bilder/annahme-riegel.svg
        inhalt: |-
          **Ablauf:** Auf jedem Feld: 3 Annehmer (Pos I, VI, V) gegen Aufschläger, ein Zuspieler am Netz.

          * Annehmer rufen „Ich!“, wer nicht annimmt, öffnet sich zum Annehmer.
          * 🟢 Zuspieler fängt. 🔵 Zuspieler pritscht zu Pos IV. 🔴 Zuspiel wird verwertet (über das Netz).

          **Trainer-Details:** Absprache: Bälle zwischen zwei Spielern nimmt der, der weiter zur Mitte steht.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 3:3 Kontakt-Bonus
        bild: bilder/3v3-kontakt.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Kleinfeld.

          * Punkt zählt 2, wenn alle drei Spieler den Ball berührt haben.
          * Einsteiger dürfen den ersten Ball fangen.

          **Trainer-Details:** Der Bonus bringt Starke dazu, Schwächere einzubinden statt alles selbst zu spielen.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 3:3 Turnier (Kurzspiele)
        bild: bilder/3v3-turnier.svg
        inhalt: |-
          **Ablauf:** Teams für heute fest, Spiele auf Zeit (5 Minuten), danach Gegner wechseln.

          * Aufschlag von unten oder oben nach Wahl.
          * Stufen-Regeln wie in TE 5.

          **Trainer-Details:** Spielstände notieren. Fair-Play-Punkt für das Team, das am lautesten kommuniziert.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Nächste Woche ist Check-Woche. Jedes Kind wählt sein Aufschlag-Ziel.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 4
    einheiten:
    - name: TE 7
      dauer: 90
      titel: 'Check-Woche: Aufschlag & Annahme'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Alle Ballschul-Aufgaben des Monats.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🎯
        phase: Technik I
        dauer: 25
        titel: Abzeichen Aufschlag & Annahme
        bild: bilder/abzeichen-aufschlag.svg
        inhalt: |-
          **Ablauf:** Stationen mit Zähler-Kindern, Ergebnisse auf die Liste vom Monat 1.

          * Vorab 2 Minuten Brett-Check: auf „Brett!“ einfrieren, der Partner prüft die 3 Merkpunkte (Daumen parallel, Arme gestreckt, Knie gebeugt).
          * Station 1: 10 Aufschläge von der gewählten Distanz – Treffer zählen.
          * Station 2: 10 Annahmen (Zuwurf/Aufschlag) – wie viele erreicht der Zuspieler?
          * Station 3: 10 Zuspiele vom Netz zu Pos IV – wie viele sind hoch und fangbar?
          * 🟢 5 / 🔵 7 / 🔴 9 Treffer pro Station.

          **Trainer-Details:** Die Distanz beim Aufschlag gehört zum Ergebnis (z. B. „7 von 10 aus 6 m“).
        varianten:
          6-8: Zwei Stationen gleichzeitig, Trainer an Station 3.
          9-12: Drei Stationen gleichzeitig.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Freies Üben der schwächsten Station
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Jedes Kind übt in einer 3er-Gruppe die Station, die ihm am schwersten fiel.

          * Trainer korrigiert genau einen Punkt pro Kind.

          **Trainer-Details:** Individuelles Feedback geht vor neuer Übung.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 35
        titel: Kaiserturnier 3:3
        bild: bilder/kaiser-3v3.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (3:3). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Kaiserfeld: Drei Kontakte Pflicht, Aufschlag von oben gibt einen Bonuspunkt bei Treffer.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Abzeichen verkünden.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 8
      tag: Freitag
      dauer: 120
      titel: Monatsturnier 3:3
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Lieblings-Fangspiel
        bild: bilder/lieblings-fangspiel.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Kinder wählen eines der Fangspiele aus den letzten Wochen.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Einspielen wie vor einem Spiel
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare: Pritschen, Baggern, dann Aufschläge über das Netz.

          **Trainer-Details:** Ablauf merken: Diesen Einspiel-Ablauf nutzen wir ab jetzt vor jedem Turnier.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Kooperativ-Rekord 3:3
        bild: bilder/3v3-kooperativ.svg
        inhalt: |-
          **Ablauf:** Zwei 3er-Teams spielen kooperativ über das Netz, je Seite 3 Kontakte. Wie viele Überquerungen?

          * Hallenrekord aus Monat 1 knacken (dort im 2:2).

          **Trainer-Details:** Kinder feiern lassen, wenn der Rekord fällt.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 60
        titel: Monatsturnier 3:3
        bild: bilder/3v3-turnier.svg
        inhalt: |-
          **Ablauf:** Ausgeloste, gemischte 3er-Teams. Gruppenphase (5 Minuten pro Spiel), dann Platzierungsspiele.

          * Aufschlag nach Stufe (von unten oder oben).
          * Punkt mit 3 Kontakten zählt 2.
          * Pausierende Teams pfeifen und zählen.

          **Trainer-Details:** Kinder als Schiedsrichter einsetzen. Am Ende Siegerehrung und Fair-Play-Preis.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 15
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Monatsrückblick: Welche Aufschlag-Distanz schaffe ich jetzt? Siegerehrung.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
- name: Monat 3
  thema: 'Angreifen & Spielen: Schlagwurf, Angriff und Abwehr im 3:3 und 4:4'
  titel: Angreifen und Spielen
  wochen:
  - name: Woche 1
    einheiten:
    - name: TE 1
      dauer: 90
      titel: Schlagwurf und Schlag aus dem Stand
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball einhändig über Kopf hochwerfen und mit der anderen Hand über Kopf fangen (Schlagarm-Gefühl).

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: 'Stemmschritt: bremsen und hoch'
        bild: bilder/stemmschritt-fuesse.svg
        inhalt: |-
          **Ablauf:** Alle ohne Ball an einer Linie (z. B. 3-m-Linie). Trainer macht vor, alle sprechen laut mit: „Rechts – Links – Hoch!“.

          * **Stopp an der Linie (3 Min):** Aus lockerem Laufen mit einem langen rechten Schritt auf die Ferse landen, links schnell daneben. Einfrieren: Knie gebeugt, Arme hinten. Partner prüft: Füße schulterbreit, links etwas vor?
          * **Stemmen und hoch (4 Min):** Wie oben, aber nach dem Stemmen sofort beidbeinig senkrecht hochspringen und am selben Fleck landen.
          * **Reifen-Stemmen (3 Min):** Zwei Reifen nebeneinander. Aus 2 Schritten in die Reifen stemmen (rechts in den einen, links in den anderen) und hochspringen.
          * 🟢 Aus dem Gehen, nur stemmen und stoppen, kein Sprung.
          * 🔵 Aus 2 Schritten stemmen und springen. Landung höchstens eine Fußlänge vor dem Absprung.
          * 🔴 Aus 3 Schritten, im Sprung einen Ball berühren, den der Trainer hochhält.

          **Trainer-Details:** **Merkpunkte Stemmschritt (Rechtshänder):** Der vorletzte Schritt (rechts) ist lang und flach und landet auf der Ferse. Der linke Fuß kommt schnell daneben, etwas weiter vorn. Beide Füße stemmen, die Knie beugen, die Arme sind ganz hinten. Dann Arme nach vorn-oben reißen und beidbeinig hoch. Linkshänder spiegelverkehrt (links lang, rechts dazu). Der Stemmschritt wandelt das Tempo nach vorn in Höhe um. Wer nach vorn springt, hat zu kurz gestemmt. Landung immer beidbeinig und weich.
        varianten:
          6-8: Alle in einer Reihe nebeneinander, Trainer prüft jedes Kind einzeln.
          9-12: 'Zwei Linien, auf jeder Linie Paare: eines springt, eines prüft.'
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Schlagwurf zum Schlag
        bild: bilder/schlag-paar.svg
        inhalt: |-
          **Ablauf:** Paare, 5 m Abstand, Wand oder über das Netz.

          * 🟢 Schlagwurf: Ball über Kopf mit Schlagarm zum Partner werfen, Ellbogen hoch.
          * 🔵 Ball selbst hochwerfen und aus dem Stand mit flacher Hand vor den Partner auf den Boden schlagen (Ball springt zum Partner).
          * 🔴 Dauerschlag gegen die Wand: Ball schlagen, Wand, Boden, wieder schlagen. Ziel 10 in Folge.

          **Trainer-Details:** Ellbogen über Schulterhöhe, Treffpunkt vor dem Kopf, Handgelenk locker, „Hand über den Ball“.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Angriff aus dem Stand über das Netz
        bild: bilder/angriff-stand.svg
        inhalt: |-
          **Ablauf:** Netz eher niedrig (2,00 m). Angreifer auf Pos IV, Zuwerfer daneben. Zwei Reihen.

          * 🟢 Ball wird hochgeworfen, Angreifer schlägt im Stand oder mit kleinem Hüpfer über das Netz.
          * 🔵 Ball wird hoch angeworfen, Angreifer springt ab und schlägt.
          * 🔴 Ball wird gepritscht, Ziel: Reifen in Zone I oder V.

          **Trainer-Details:** Kurze Reihen (max. 3 Kinder), Wartende holen Bälle oder werfen zu. Pro Kind mindestens 15 Schläge.
        varianten:
          6-8: Eine Reihe, Trainer wirft zu, Stufe wird pro Kind angepasst.
          9-12: 'Zwei Netze/Stationen: Pos IV und Pos II.'
      - icon: 🧠
        phase: Spielform
        dauer: 15
        titel: 'Angriff oder Lob: 2:2'
        bild: bilder/2v2-angriff.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld, der 3. Ball muss angegriffen werden.

          * 🟢 Lob oder Pritsche über das Netz zählt als Angriff.
          * 🔵 Schlag aus dem Stand.
          * 🔴 Schlag mit Sprung; Lob nur als Finte.

          **Trainer-Details:** Jedes Kind spielt auf seiner Stufe, auch im selben Team. Punkt durch Angriff = 2 Punkte.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 2:2
        bild: bilder/kaiser-2v2.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (2:2). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Kaiserfeld: Punkt nur durch Angriffsschlag oder gegnerischen Fehler.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat seinen ersten Schlag über das Netz geschafft?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 2
      tag: Freitag
      dauer: 120
      titel: Anlauf lernen
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Anlauf-Rhythmus
        bild: bilder/anlauf.svg
        inhalt: |-
          **Ablauf:** Alle an der Grundlinie, Anlauf bis zur 3-m-Linie, zurückgehen, wieder anlaufen. Danach Ball-Aufgaben.

          * 🟢 2-Schritt-Anlauf (Rechtshänder: links – rechts-links), beidbeiniger Absprung.
          * 🔵 3-Schritt-Anlauf mit Armschwung nach hinten und hoch.
          * 🔴 4-Schritt-Anlauf, Landung beidbeinig, stabil, nicht ins Netz.
          * Zum Schluss: Anlauf und Absprung, dabei einen Ball, der vom Trainer hochgehalten wird, mit der Schlaghand berühren.

          **Trainer-Details:** Laut mitsprechen lassen („Links – Rechts-Links – Hoch!“). Linkshänder spiegelverkehrt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Schlag-Wiederholung im Paar
        bild: bilder/schlag-paar.svg
        inhalt: |-
          **Ablauf:** Paare, Schlag aus dem Stand wie in TE 1.

          * 🟢 Schlagwurf. 🔵 Schlag auf den Boden zum Partner. 🔴 Dauerschlag an der Wand.

          **Trainer-Details:** Jedes Kind macht mindestens 30 Schläge.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Anlauf mit Fangen
        bild: bilder/anlauf-fangen.svg
        inhalt: |-
          **Ablauf:** Angreifer laufen an Pos IV an, springen ab und fangen den hochgeworfenen Ball im höchsten Punkt mit beiden Händen über dem Kopf.

          * 🟢 Ohne Anlauf: Stand-Absprung und fangen.
          * 🔵 2- oder 3-Schritt-Anlauf, fangen.
          * 🔴 Fangen und in der Luft über das Netz werfen (Schlagwurf im Sprung).

          **Trainer-Details:** Timing lernen: Anlauf beginnt, wenn der Ball oben ist. Absprung mit beiden Beinen, Landung auf beiden Beinen.
        varianten:
          6-8: Trainer wirft, alle in einer Reihe.
          9-12: Zwei Stationen, ein starkes Kind wirft an Station 2.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: Annahme – Zuspiel – Angriff (kooperativ)
        bild: bilder/kette-angriff.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen am Netz: A nimmt einen Wurf an, B spielt zu, C greift an (Stufe nach Wahl).

          * Nach jedem Angriff Positionen wechseln. Jede Gruppe zählt erfolgreiche Angriffe.

          **Trainer-Details:** Erstes Zusammensetzen der kompletten Kette. Ungenauigkeit ist erlaubt.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 25
        titel: 3:3 mit Angriffspflicht
        bild: bilder/3v3-angriff.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Kleinfeld. Der 3. Ball muss angegriffen werden (Stufe frei wählbar).

          * Angriffspunkt = 2 Punkte, Lob = 1 Punkt.
          * Einsteiger dürfen die Annahme fangen.

          **Trainer-Details:** Zuspieler bewusst hoch und nah am Netz spielen lassen.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 3:3 freies Spiel
        bild: bilder/3v3-frei.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Kleinfeld, normale Regeln (Aufschlag nach Wahl, kein Fangen).

          * Nach jedem Satz bis 11 Teams neu mischen.

          **Trainer-Details:** Freies Spiel ohne Sonderregeln: Kinder sollen das Gelernte selbst anwenden.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Merksatz: „Erst der Ball, dann der Anlauf.“

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 2
    einheiten:
    - name: TE 3
      dauer: 90
      titel: Angriff mit Zuspiel
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: Anlauf-Rhythmus
        bild: bilder/anlauf.svg
        inhalt: |-
          **Ablauf:** Alle an der Grundlinie, Anlauf bis zur 3-m-Linie, zurückgehen, wieder anlaufen. Danach Ball-Aufgaben.

          * 🟢 2-Schritt-Anlauf (Rechtshänder: links – rechts-links), beidbeiniger Absprung.
          * 🔵 3-Schritt-Anlauf mit Armschwung nach hinten und hoch.
          * 🔴 4-Schritt-Anlauf, Landung beidbeinig, stabil, nicht ins Netz.
          * Danach: Anlauf mit Ball in den Händen, im Sprung Ball über das Netz werfen.

          **Trainer-Details:** Laut mitsprechen lassen („Links – Rechts-Links – Hoch!“). Linkshänder spiegelverkehrt.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: Stemmschritt mit Armschwung
        bild: bilder/stemmschritt-arme.svg
        inhalt: |-
          **Ablauf:** Alle ohne Ball, dann mit Ziel. Trainer zählt den Rhythmus.

          * **Pendel-Arme im Stand (2 Min):** Beide Arme nach hinten schwingen, Knie beugen, Arme nach vorn-oben reißen und springen. 10x.
          * **Schritt und Arme koppeln (4 Min):** Beim langen rechten Schritt gehen beide Arme nach hinten. Beim Stemmen sind sie ganz hinten. Beim Absprung reißen beide nach vorn-oben.
          * **Hoch zum Ziel (4 Min):** Trainer oder großes Kind hält einen Ball auf der Langbank stehend hoch. Anlaufen, stemmen, abspringen, den Ball mit der Schlaghand berühren.
          * 🟢 2-Schritt-Anlauf, Arme erst im Stand üben, dann koppeln.
          * 🔵 3-Schritt-Anlauf mit vollem Armschwung.
          * 🔴 3-Schritt-Anlauf, Schlagarm geht nach dem Armschwung in Ausholposition (Ellbogen hoch hinter dem Kopf).

          **Trainer-Details:** Der Armschwung bringt ein gutes Stück Sprunghöhe. Häufigster Fehler: Arme hängen beim Stemmen unten oder schwingen nur einseitig. **Merkpunkte Stemmschritt (Rechtshänder):** Der vorletzte Schritt (rechts) ist lang und flach und landet auf der Ferse. Der linke Fuß kommt schnell daneben, etwas weiter vorn. Beide Füße stemmen, die Knie beugen, die Arme sind ganz hinten. Dann Arme nach vorn-oben reißen und beidbeinig hoch. Linkshänder spiegelverkehrt (links lang, rechts dazu).
        varianten:
          6-8: 'Eine Reihe, Trainer hält den Ball. Wartezeit kurz halten: nach jedem Sprung direkt wieder anstellen.'
          9-12: 'Zwei Stationen: an einer hält der Trainer den Ball, an der anderen üben Paare die Pendel-Arme.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Schlag im Paar mit Kontrolle
        bild: bilder/schlag-kontrolle.svg
        inhalt: |-
          **Ablauf:** Paare, 6 m Abstand. A schlägt den Ball auf den Boden vor B, B baggert hoch zurück, A fängt.

          * 🟢 A wirft statt zu schlagen. 🔵 A schlägt aus dem Stand. 🔴 A schlägt, B baggert, A pritscht zu sich und schlägt wieder (Dauerkette).

          **Trainer-Details:** Schlagen und Abwehren in einer Übung: doppelte Kontaktzahl.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 25
        titel: Angriff nach Zuspiel
        bild: bilder/angriff-zuspiel.svg
        inhalt: |-
          **Ablauf:** Zuspieler (Trainer oder starkes Kind) auf Pos III, Angreifer laufen von Pos IV an.

          * 🟢 Ball wird angeworfen, Schlag mit kleinem Sprung.
          * 🔵 Ball wird gepritscht, Anlauf 2–3 Schritte.
          * 🔴 Annahme vom Trainer, eigenes Zuspiel kommt vom Zuspieler, Angriff in eine angesagte Zone.

          **Trainer-Details:** Kurze Reihen, Kinder wechseln nach 3 Schlägen zum Ballholen/Zuspiel. Gelobt wird der saubere Armzug, nicht die Härte.
        varianten:
          6-8: Eine Station, Trainer spielt zu.
          9-12: Zwei Stationen (Pos IV und Pos II).
      - icon: 🧠
        phase: Spielform
        dauer: 15
        titel: 3:3 Abwehr-Bonus
        bild: bilder/3v3-abwehr.svg
        inhalt: |-
          **Ablauf:** 3:3 auf Kleinfeld. Der Ballwechsel startet mit einem Angriff vom Trainer/Startteam.

          * Abgewehrter Angriff, der zu einem Gegenangriff wird = 2 Punkte.
          * Stufen für den Angriff wie bei der Technik.

          **Trainer-Details:** Abwehr: tief stehen, Brett früh, Ball hoch in die eigene Feldmitte spielen.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 3:3
        bild: bilder/kaiser-3v3.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (3:3). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Punkt durch Angriffsschlag zählt 2.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat seinen Rekord an Angriffen über das Netz verbessert?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 4
      tag: Freitag
      dauer: 120
      titel: 'Abwehr: Bälle retten'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Ball-Hüter
        bild: bilder/ball-hueter.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Jedes Kind dribbelt einen Ball (Hand oder Fuß). Die Fänger versuchen, Bälle wegzuschlagen. Wer seinen Ball verliert, holt ihn zurück und macht 5 Bagger über Kopf, bevor er weiterspielt.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Abwehr im Paar
        bild: bilder/abwehr-paar.svg
        inhalt: |-
          **Ablauf:** Paare, 5 m Abstand. A schlägt/wirft hart auf B, B wehrt hoch ab.

          * 🟢 A wirft von unten auf den Bauch. 🔵 A schlägt aus dem Stand. 🔴 A schlägt links/rechts, B muss 1–2 Schritte machen.

          **Trainer-Details:** Tief stehen, Gewicht vorn, Arme locker. Ball **hoch** abwehren, nicht zurück zum Angreifer.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Abwehr – Zuspiel – Angriff
        bild: bilder/abwehr-zuspiel-angriff.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: Trainer schlägt auf A (Abwehr), B spielt zu, C greift an.

          * 🟢 Trainer wirft. 🔵 Trainer schlägt locker. 🔴 Trainer schlägt in wechselnde Richtungen.

          **Trainer-Details:** Das ist die Situation aus dem echten Spiel. Laut rufen bei der Abwehr („Ich!“).
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: Aufschlag-Wiederholung
        bild: bilder/aufschlag-zonen.svg
        inhalt: |-
          **Ablauf:** Aufschläge in Zonen, Distanz und Technik nach Stufe aus Monat 2.

          * Ziel: 5 Treffer in Folge, dann schwierigere Zone wählen.

          **Trainer-Details:** Damit der Aufschlag nicht verloren geht. Jedes Kind mindestens 20 Aufschläge.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 25
        titel: 4:4 kennenlernen
        bild: bilder/4v4-kennenlernen.svg
        inhalt: |-
          **Ablauf:** 4:4 auf Feld ca. 7 × 7 m pro Seite. Aufstellung: 2 vorn, 2 hinten (oder Raute).

          * Rotation nach jedem Aufschlagwechsel.
          * 🟢 Annahme darf gefangen werden. 🔵 Kein Fangen. 🔴 Angriff Pflicht beim 3. Ball.

          **Trainer-Details:** 4:4 ist in der U13 das Wettkampfformat in vielen Landesverbänden. Wichtig: Wer läuft wohin? Kurz an der Tafel zeigen.
        varianten:
          6-8: Ein Feld 4:4 bei 8 Kindern; bei 6–7 Kindern 3:3 plus Joker.
          9-12: Ein Feld 4:4, nebenan 2:2 mit Wechsel nach jedem Satz.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 3:3 oder 4:4 frei
        bild: bilder/4v4-frei.svg
        inhalt: |-
          **Ablauf:** Freies Spiel in der Form, die zur Anzahl der Kinder passt.

          * Satz bis 15, dann Teams mischen.

          **Trainer-Details:** Kinder dürfen die Teams einmal selbst wählen, dann Trainer.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Frage: Was ist bei der Abwehr anders als bei der Annahme?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 3
    einheiten:
    - name: TE 5
      dauer: 90
      titel: Spielen mit allen Elementen
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Alle Ballschul-Aufgaben in schneller Folge, dazu Anlauf mit Ball.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: Stemmschritt-Parcours mit Reifen
        bild: bilder/stemmschritt-parcours.svg
        inhalt: |-
          **Ablauf:** Vor dem Netz liegen Reifen als Fußspur: ein Reifen links, ein Reifen weit entfernt rechts (langer Schritt), dann zwei Reifen nebeneinander (Stemmschritt). Anlauf durch die Reifen, Stemmen, Absprung am Netz.

          * Rechtshänder: L – R (lang) – L/R. Linkshänder bekommen eine gespiegelte Reifen-Spur.
          * Trainer wirft beim Stemmen einen Ball hoch vor das Netz.
          * 🟢 Nur die Spur laufen, stemmen, hoch springen, kein Ball.
          * 🔵 Den geworfenen Ball im höchsten Punkt mit beiden Händen fangen.
          * 🔴 Ball im Sprung fangen und mit Schlagwurf über das Netz werfen, oder direkt schlagen.

          **Trainer-Details:** Die Reifen geben die Schrittlänge vor, nach einigen Durchgängen den mittleren Reifen weglassen. Höchstens 3 Kinder pro Reihe, Wartende holen Bälle. **Merkpunkte Stemmschritt (Rechtshänder):** Der vorletzte Schritt (rechts) ist lang und flach und landet auf der Ferse. Der linke Fuß kommt schnell daneben, etwas weiter vorn. Beide Füße stemmen, die Knie beugen, die Arme sind ganz hinten. Dann Arme nach vorn-oben reißen und beidbeinig hoch. Linkshänder spiegelverkehrt (links lang, rechts dazu).
        varianten:
          6-8: Eine Reifen-Spur, Trainer wirft.
          9-12: Zwei Reifen-Spuren an Pos IV und Pos II, ein sicheres Kind wirft an der zweiten Spur.
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Einspielen-Kette
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare: 3 Minuten Pritschen, 3 Minuten Baggern, 3 Minuten Schlag–Abwehr, 3 Minuten freies Spiel über das Netz.

          **Trainer-Details:** Der feste Einspielablauf wie vor einem Spiel.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Angriffs-Serie
        bild: bilder/angriff-serie.svg
        inhalt: |-
          **Ablauf:** Zwei Reihen: Annahme vom Trainer, Zuspiel durch ein Kind, Angriff.

          * 🟢 Lob oder Schlag aus dem Stand. 🔵 Angriff mit Anlauf. 🔴 Angriff in angesagte Zone (I, V oder VI).

          **Trainer-Details:** Jedes Kind macht mindestens 10 Angriffe. Zuspieler wechselt nach 5 Bällen.
        varianten:
          6-8: Eine Reihe, alle rotieren durch Annahme, Zuspiel, Angriff.
          9-12: Zwei Reihen auf beiden Seiten des Netzes.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 4:4 „Jeder greift an“
        bild: bilder/4v4-jeder.svg
        inhalt: |-
          **Ablauf:** 4:4 auf Kleinfeld, gemischte Teams.

          * Punkt zählt nur durch Angriff oder Fehler des Gegners.
          * Wer im Satz noch nicht angegriffen hat, bringt bei seinem ersten Angriffspunkt 3 Punkte.

          **Trainer-Details:** Damit spielen die Starken gezielt die Schwächeren an.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 3:3
        bild: bilder/kaiser-3v3.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (3:3). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Normale Regeln.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Nächste Woche: Abschluss-Check und großes Turnier.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 6
      tag: Freitag
      dauer: 120
      titel: Wettkampf-Situationen
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Zonenfangen
        bild: bilder/zonenfangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Wie im Monat 2: Fänger ruft eine Position, alle laufen hin.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Einspielen-Kette
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare: Pritschen, Baggern, Schlag–Abwehr, Aufschlag.

          **Trainer-Details:** Der Ablauf sollte inzwischen ohne Ansagen laufen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Aufschlag – Annahme – Angriff
        bild: bilder/sideout.svg
        inhalt: |-
          **Ablauf:** Aufschläger gegen ein 3er- oder 4er-Team. Das Team nimmt an, spielt zu, greift an.

          * Erfolgreicher Angriff = 1 Punkt fürs Team. Aufschlagpunkt = 1 Punkt für Aufschläger.
          * Nach 6 Aufschlägen wechseln.

          **Trainer-Details:** Das ist der „Side-out“: Hier wird im echten Spiel entschieden, wer gewinnt.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: Notbälle
        bild: bilder/notbaelle.svg
        inhalt: |-
          **Ablauf:** Trainer spielt ungenaue Bälle (zu weit, zu kurz, ins Netz) ins Feld. Team muss den Ball irgendwie über das Netz retten.

          * 🟢 Ein Kontakt darf gefangen werden. 🔵/🔴 Ohne Fangen, Ball muss hoch über das Netz.

          **Trainer-Details:** Kein Ball ist verloren! Beim Notball zuerst hoch spielen, dann weiter.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: Spielstand-Spiele
        bild: bilder/4v4-spielstand.svg
        inhalt: |-
          **Ablauf:** 4:4 (oder 3:3) mit vorgegebenen Spielständen: 12:12, 13:14, 14:14. Zwei Sätze pro Paarung.

          * Wer den Satz gewinnt, darf sich die nächste Aufschlagseite aussuchen.

          **Trainer-Details:** Kinder lernen, mit Druck umzugehen. Danach kurz fragen: Was hat geholfen?
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 25
        titel: 4:4 Liga-Spiel
        bild: bilder/4v4-liga.svg
        inhalt: |-
          **Ablauf:** 4:4 nach Wettkampfregeln (Aufschlag nach Stufe), zwei Sätze bis 15.

          * Kinder pfeifen selbst.

          **Trainer-Details:** Hier zeigt sich, was im Turnier nächste Woche noch geübt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Jedes Kind sagt, auf welches Abzeichen es nächste Woche hinarbeitet.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 4
    einheiten:
    - name: TE 7
      dauer: 90
      titel: 'Abschluss-Check: alle Basics'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Wunsch-Aufgaben der Kinder.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🎯
        phase: Technik I
        dauer: 30
        titel: Großes Basics-Abzeichen
        bild: bilder/abzeichen-gross.svg
        inhalt: |-
          **Ablauf:** Stationen mit Zähler-Kindern; Ergebnisse auf die Liste aus Monat 1 und 2.

          * Station 1: Pritschen allein (in Folge).
          * Station 2: Baggern allein (in Folge).
          * Station 3: 10 Aufschläge (Treffer und Distanz).
          * Station 4: 10 Angriffe nach Zuwurf/Zuspiel (Treffer ins Feld).
          * Station 5: Stemmschritt-Check. 3 Anläufe, der Zähler prüft: langer Schritt, Stemmen beidbeinig, Landung am Absprungort. Jeder sauber gezeigte Anlauf zählt.
          * Vergleich mit Monat 1: Wer hat sich wie stark verbessert?

          **Trainer-Details:** Verbesserung zählt mehr als das absolute Ergebnis. „Größter Sprung“ als eigene Auszeichnung.
        varianten:
          6-8: Zwei Stationen gleichzeitig.
          9-12: Vier Stationen gleichzeitig, 4 Minuten pro Station.
      - icon: 🧠
        phase: Spielform
        dauer: 15
        titel: Kooperativ-Rekord 4:4
        bild: bilder/4v4-kooperativ.svg
        inhalt: |-
          **Ablauf:** Zwei Teams kooperativ über das Netz, je Seite 3 Kontakte. Hallenrekord aus Monat 1 und 2 knacken.

          **Trainer-Details:** Ein schöner gemeinsamer Erfolg vor dem Turnier.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 30
        titel: Kaiserturnier 3:3
        bild: bilder/kaiser-3v3.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (3:3). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Kaiserfeld: Punkt durch Angriff zählt 2.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Abzeichen verkünden, „Größter Sprung“ ehren.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 8
      tag: Freitag
      dauer: 120
      titel: Abschlussturnier
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: Lieblings-Fangspiel
        bild: bilder/lieblings-fangspiel.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Kinder wählen.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Einspielen wie im Wettkampf
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Einspielen-Kette in Paaren, danach Einschlagen am Netz mit Zuspiel.

          **Trainer-Details:** Ablauf wie bei einem Spieltag.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 80
        titel: Abschlussturnier 4:4 (bzw. 3:3)
        bild: bilder/4v4-turnier.svg
        inhalt: |-
          **Ablauf:** Ausgeloste, gemischte Teams. Gruppenphase (6 Minuten pro Spiel), dann Halbfinale und Finale.

          * Wettkampfregeln, Aufschlag nach Stufe.
          * Pausierende Teams pfeifen, zählen, feuern an.
          * Option: letztes Spiel Kinder gegen Eltern/Trainer.

          **Trainer-Details:** Ein Fest zum Abschluss der 3 Monate. Fotos machen, Urkunden für Abzeichen vorbereiten.
        varianten:
          6-8: Zwei Teams à 3–4 Kinder spielen mehrere kurze Sätze, dazwischen 1:1-Kaiserturnier.
          9-12: Drei Teams à 3–4 Kinder, jeder gegen jeden, dann Finale.
      - icon: 🧘
        phase: Abschluss
        dauer: 15
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Rückblick auf 3 Monate: Abzeichen-Urkunden, Ausblick auf den nächsten Block.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
