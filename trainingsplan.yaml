# Trainingsplan 3 Monate – RTK-Spielreihe & Basics (U13)
#
# Gleiches Format wie trainingsplan.yaml (monate -> wochen -> einheiten -> uebungen).
# Zum Benutzen: diese Datei als trainingsplan.yaml neben die App legen, oder die
# Einträge unter "monate:" an die bestehende trainingsplan.yaml anhängen.
#
# Leitideen (DVV-Rahmentrainingskonzeption, RTK, und Best Practice Jugendvolleyball):
#   * Spielgemäß lernen: Spielreihe 1:1 -> 2:2 -> 3:3 -> 4:4 auf Kleinfeldern,
#     jede Einheit endet mit Spielen.
#   * Viele Ballkontakte: höchstens 2-3 Kinder pro Ball, kurze Reihen, keine Wartezeit
#     über 30 Sekunden, Wartende werfen zu, zählen oder holen Bälle.
#   * Basics zuerst: Pritschen und Baggern (Monat 1), Aufschlag, Annahme, Zuspiel
#     (Monat 2), Angriff und Abwehr (Monat 3). Jede Woche wird Gelerntes wiederholt.
#   * Differenzierung in drei Stufen, die Kinder wählen selbst und steigen auf:
#       🟢 Stufe 1 = Einsteiger   🔵 Stufe 2 = Mittel   🔴 Stufe 3 = Fortgeschrittene
#   * Woche 4 jedes Monats: Basics-Abzeichen (Kontakte zählen) und Turnier.
#   * Netz 2,00-2,15 m oder Leine; Feldgrößen sind Richtwerte.
# "varianten" passen eine Übung an die Anzahl anwesender Spieler an (wie in der App).
# Optional pro Übung, für Bilder und Videos:
#   bild: bilder/datei.svg      (Skizze oder Foto im Ordner "bilder", oder ein https-Link)
#   video: https://youtu.be/... (YouTube-Link oder eigenes Video im Ordner "bilder")
#   link: https://...           (Quelle zum Nachlesen, z. B. eine Übung auf einer Trainerseite)

# Kalender für den Knopf "Heute" in der App:
#   ab_monat:  ab diesem Monat bekommen die Einheiten ein Datum (Monat 1 ist schon vorbei)
#   start:     Montag der Woche, in der dieser Monat mit Woche 1 beginnt
#   tage:      Trainingstage. Die 1. Einheit einer Woche liegt am 1. Tag, die 2. am 2. Tag.
#   pausen:    Ferien oder Hallensperren (von/bis). Fällt ein Trainingstag hinein,
#              wird die ganze Woche übersprungen und der Plan rückt eine Woche nach hinten.
# Einzelne Einheiten außerhalb des Kalenders (z. B. ein Extra-Training) bekommen ihr
# Datum direkt in der Einheit: datum: 2026-10-30
kalender:
  ab_monat: 2
  start: 2026-11-02
  tage: [Mittwoch, Freitag]
  pausen:
  - von: 2026-12-23
    bis: 2027-01-06
    name: Weihnachtsferien

monate:
- name: Monat 1
  thema: 'Pritschen & Baggern: den Ball kontrollieren (Spielreihe 1:1 → 2:2)'
  titel: Ballkontrolle im Kleinfeld
  wochen:
  - name: Woche 1
    einheiten:
    - name: TE 1
      dauer: 90
      titel: 'Pritschen: Ball über die Stirn'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball über Kopf hochwerfen und mit Pritschbewegung wieder nach oben drücken, ohne zu fangen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: ✋
        phase: Handhaltung
        dauer: 10
        titel: Körbchen bauen
        bild: bilder/handhaltung-merkbild.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Trainer steht vorn und macht vor. Vier kurze Aufgaben à 2 Minuten, noch ohne in die Luft zu pritschen.

          * **Fenster:** Daumen und Zeigefinger bilden ein Dreieck. Durch das Fenster den Trainer anschauen und die Hände eine Faust breit vor die Stirn nehmen.
          * **Handabdruck:** Ball liegt vor den Füßen. Hände von oben auf den Ball legen, alle 10 Finger weit gespreizt. In genau dieser Form den Ball aufheben und über die Stirn führen, ohne die Finger zu verschieben.
          * **Ball ins Körbchen fallen lassen:** Ball mit gestreckten Armen über den Kopf halten, loslassen und im Körbchen über der Stirn auffangen. Leise fangen: Finger und Handgelenke geben nach, Ellbogen gehen zur Seite.
          * **„Körbchen!“:** Alle prellen frei durch die Halle. Auf Zuruf sofort Ball über die Stirn und einfrieren. Trainer geht herum und prüft.
          * 🟢 Mit Softball oder Luftballon, der Ball kommt langsam und die Hände haben Zeit.
          * 🔵 Ball aus 50 cm über dem Kopf fallen lassen, fangen, 3 Sekunden halten.
          * 🔴 Ball 1 m hochwerfen, im Körbchen fangen und sofort ganz kurz zurückdrücken (nur Finger und Handgelenke).

          **Trainer-Details:** **Die 3 Merkpunkte (Körbchen):** 1. Daumen zeigen zur Nase, nicht nach vorn. 2. Finger weit gespreizt, nur die Finger berühren den Ball, die Handflächen bleiben frei. 3. Hände eine Faust breit über und vor der Stirn, Ellbogen schräg nach außen. Typische Fehler: Handflächen am Ball (es klatscht), Daumen zeigen nach vorn (Ball rutscht durch), Finger geschlossen, Hände vor dem Gesicht statt über der Stirn. Lieber ein Kind kurz in die richtige Form „modellieren“ als lange erklären.
        varianten:
          6-8: Trainer korrigiert jedes Kind einzeln mit den Händen am Ball.
          9-12: 'Paare: eines macht die Aufgabe, eines prüft die 3 Merkpunkte, nach jeder Aufgabe wechseln.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Bonus: Wer schafft es, beim Pritschen langsam in die Hocke und wieder hoch zu gehen?

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: 'Pritschen im Paar: Werfen – Pritschen'
        bild: bilder/pritschen-paar.svg
        inhalt: |-
          **Ablauf:** Paare, 3 m Abstand. A wirft hoch zu B, B pritscht zurück. Nach 10 Würfen wechseln.

          * 🟢 B fängt über der Stirn und drückt sofort zurück (kein Ausholen).
          * 🔵 B pritscht direkt zurück, A fängt. Ziel: 10 von 10 fangbar.
          * 🔴 Durchgehend pritschen, 4 m Abstand. Ziel: 20 in Folge.

          **Trainer-Details:** Unter den Ball laufen, **vor** dem Kontakt stehen. Zielt auf Stirnhöhe des Partners.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 Pritschen über die Leine
        bild: bilder/1v1-leine.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Ball wird von oben eingeworfen. Punkt, wenn der Ball im gegnerischen Feld den Boden berührt.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 1:1
        bild: bilder/kaiser-1v1.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (1:1). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Gespielt wird mit den Regeln aus der Spielform; jedes Kind wählt seine Stufe.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Hausaufgabe: 5 Minuten zuhause Fang-Pritschen oder Pritschen gegen die Wand.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 2
      tag: Freitag
      dauer: 120
      titel: 'Baggern: das Brett bauen'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Ball-Retter
        bild: bilder/ball-retter.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Wer einen Ball in Pritschhaltung über dem Kopf hält, kann nicht gefangen werden. Es gibt nur halb so viele Bälle wie Kinder: Ball an Mitspieler weiterwerfen, um sie zu retten.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Baggern allein (Brett bauen)
        bild: bilder/baggern-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Erst 1 Minute Brett zeigen: Hände ineinander, Daumen parallel, Arme gestreckt, Schultern nach vorn.

          * 🟢 Ball aus 1 m auf das Brett fallen lassen, hochspringen lassen, fangen. Ziel: 10x sauber.
          * 🔵 Bagger über dem Kopf, Ball mind. auf Kopfhöhe. Ziel: 15 in Folge.
          * 🔴 Wechsel Bagger – Pritsche – Bagger. Ziel: 20 in Folge.
          * Bonus: Ball auf dem Brett 5 Sekunden balancieren, ohne dass er runterfällt.

          **Trainer-Details:** Arme bleiben fast still, gespielt wird aus den Beinen. Ball trifft die Unterarme oberhalb der Handgelenke.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: 'Baggern im Paar: Zuwurf – Bagger'
        bild: bilder/baggern-paar.svg
        inhalt: |-
          **Ablauf:** Paare, 3–4 m Abstand. A wirft von unten auf den Bauch von B, B baggert zurück. 10 Würfe, dann Wechsel.

          * 🟢 Ball darf einmal aufspringen, dann baggern.
          * 🔵 Direkt baggern, A soll ohne Schritt fangen können.
          * 🔴 A wirft 1 Schritt links/rechts, B macht Sidestep, stoppt und baggert.

          **Trainer-Details:** Erst stehen, dann spielen! Brett früh bilden, Schultern zum Partner drehen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: 'Pritschen-Wiederholung: Selbstpass und Pass'
        bild: bilder/selbstpass-pass.svg
        inhalt: |-
          **Ablauf:** Paare, 3–4 m Abstand, ein Ball.

          * Vorab 2 Minuten Körbchen-Check: Ball über der Stirn einfrieren, der Partner prüft die 3 Merkpunkte.
          * 🟢 Fangen – hochwerfen – pritschen zum Partner.
          * 🔵 Selbstpass pritschen, dann zum Partner.
          * 🔴 Selbstpass baggern, dann zum Partner pritschen.

          **Trainer-Details:** Der Selbstpass gibt Zeit, unter den Ball zu kommen. Er wird später im 1:1 und 2:2 gebraucht.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 mit zwei Kontakten
        bild: bilder/1v1-zwei-kontakte.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Jeder Ball wird zweimal gespielt: erst Bagger oder Pritsche zu sich selbst, dann rüber.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 25
        titel: 2:2 Fang-Volleyball
        bild: bilder/2v2-fang.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Annahme: Ball wird gefangen und zum Partner geworfen, Partner pritscht oder wirft (aus Pritschhaltung) rüber.
          * 🟢 Beide Kontakte dürfen gefangen werden.
          * 🔵 Nur der 1. Kontakt darf gefangen werden.
          * 🔴 Kein Fangen; 2. Kontakt muss gepritscht werden.
          * Spiele auf 7 Punkte, Gewinner rotiert ein Feld weiter.

          **Trainer-Details:** Teams in jedem Feld dürfen ihre Stufe gemeinsam wählen. Bei langen Ballwechseln laut loben.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Kurze Frage an die Gruppe: Wann pritsche ich, wann baggere ich? (hoch = pritschen, unter Brust = baggern)

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 2
    einheiten:
    - name: TE 3
      dauer: 90
      titel: Unter den Ball laufen
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball hochwerfen, 3 Schritte laufen, umdrehen, Ball über der Stirn fangen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: ✋
        phase: Handhaltung
        dauer: 10
        titel: 'Fingerpritschen: Rückenlage, Sitzen, Wand'
        bild: bilder/handhaltung-boden-wand.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Drei Positionen à 3 Minuten, in jeder Position laut mitzählen. Die Beine sind ausgeschaltet, so arbeiten nur Finger und Handgelenke.

          * **Rückenlage:** Auf dem Rücken liegen, Ball über der Stirn. Ball senkrecht 30–50 cm hochpritschen und wieder im Körbchen abfedern.
          * **Im Sitzen:** Grätschsitz, Ball senkrecht über den Kopf pritschen. Rücken gerade, Blick zum Ball.
          * **Wand-Trommel:** 50 cm vor der Wand stehen, Ball in Stirnhöhe ganz schnell und kurz gegen die Wand tippen. 30 Sekunden zählen.
          * 🟢 Rückenlage: jeden Ball kurz fangen und wieder hochdrücken. Ziel: 10 in Folge.
          * 🔵 Durchgehend pritschen. Ziel: 20 in Folge, Wand-Trommel 30 in 30 Sekunden.
          * 🔴 Ball bis 1 m hoch, oder Wand-Trommel mit einem Schritt mehr Abstand. Ziel: 30 in Folge.

          **Trainer-Details:** Hörtest: Ein guter Pritschball ist fast leise. Klatscht es, sind die Handflächen am Ball. **Die 3 Merkpunkte (Körbchen):** 1. Daumen zeigen zur Nase, nicht nach vorn. 2. Finger weit gespreizt, nur die Finger berühren den Ball, die Handflächen bleiben frei. 3. Hände eine Faust breit über und vor der Stirn, Ellbogen schräg nach außen.
        varianten:
          6-8: Alle gleichzeitig, Trainer zählt die Wand-Trommel laut mit.
          9-12: 'Zwei Gruppen: eine an der Wand, eine am Boden, nach 3 Minuten wechseln, damit die Wand reicht.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Neu: Pritschen im Gehen durch die Halle, ohne dass der Ball fällt.

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Pritschen nach Laufen
        bild: bilder/pritschen-laufen.svg
        inhalt: |-
          **Ablauf:** Paare, 4 m Abstand. A wirft kurz, lang, links oder rechts. B läuft hin, stoppt in Schrittstellung, pritscht zurück.

          * 🟢 Ein Schritt in eine Richtung, Ball wird hoch geworfen.
          * 🔵 2–3 Schritte, alle Richtungen.
          * 🔴 A pritscht statt zu werfen; durchgehend spielen, 15 in Folge.

          **Trainer-Details:** Rechter Fuß leicht vorn, Körper zum Ziel drehen **bevor** der Ball kommt. Nicht unter dem Ball „stochern“.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 mit Bewegung
        bild: bilder/1v1-bewegung.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Wer den Ball rüberspielt, muss danach die Grundlinie berühren.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: Kaiserturnier 1:1
        bild: bilder/kaiser-1v1.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (1:1). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Kaiserfeld: Ball muss mindestens 2 m hoch über die Leine.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat seine Stufe von letzter Woche verbessert?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 4
      tag: Freitag
      dauer: 120
      titel: Baggern zur Seite und nach vorn
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Brücken-Fangen
        bild: bilder/bruecken-fangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Gefangene stellen sich breitbeinig in Grundstellung hin und zeigen das Bagger-Brett. Befreit wird, wer von einem Mitspieler einen Ball aufs Brett geworfen bekommt und ihn zurückbaggert.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Baggern allein (Brett bauen)
        bild: bilder/baggern-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Erst 1 Minute Brett zeigen: Hände ineinander, Daumen parallel, Arme gestreckt, Schultern nach vorn.

          * 🟢 Ball aus 1 m auf das Brett fallen lassen, hochspringen lassen, fangen. Ziel: 10x sauber.
          * 🔵 Bagger über dem Kopf, Ball mind. auf Kopfhöhe. Ziel: 15 in Folge.
          * 🔴 Wechsel Bagger – Pritsche – Bagger. Ziel: 20 in Folge.
          * Neu: Baggern im langsamen Gehen vorwärts und seitwärts.

          **Trainer-Details:** Arme bleiben fast still, gespielt wird aus den Beinen. Ball trifft die Unterarme oberhalb der Handgelenke.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Bagger aus Bewegung
        bild: bilder/bagger-bewegung.svg
        inhalt: |-
          **Ablauf:** Paare, 4 m Abstand. A wirft 1–3 Schritte vor, links oder rechts von B. B läuft, stoppt, baggert zurück.

          * 🟢 Nur nach vorn, Ball kommt hoch.
          * 🔵 Vorn, links, rechts im Wechsel.
          * 🔴 A baggert statt zu werfen, durchgehend 15 in Folge.

          **Trainer-Details:** Beim Ball zur Seite: Brett schräg stellen (äußere Schulter tiefer), damit der Ball zum Partner zurück geht.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: '3er-Dreieck: Bagger – Pritsche – Fangen'
        bild: bilder/dreieck-bpf.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen im Dreieck, 4 m Abstand. A wirft zu B, B baggert zu C, C pritscht zu A.

          * 🟢 C fängt und wirft weiter.
          * 🔵 Alle Kontakte gespielt; nach 10 Bällen Positionen wechseln.
          * 🔴 Ohne Werfen: durchgehend spielen, 10 Runden in Folge.

          **Trainer-Details:** Das ist schon der Ablauf aus dem Spiel: Annahme – Zuspiel. Ziel: Bagger hoch zu C (über Kopfhöhe).
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 Baggerduell
        bild: bilder/1v1-baggerduell.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Rüber geht es nur mit dem Bagger. Selbstpass darf gepritscht werden.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 25
        titel: 2:2 mit Pflichtpass
        bild: bilder/2v2-pflichtpass.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Jedes Team muss den Ball mindestens zweimal spielen, einmal davon zum Partner.
          * 🟢 1. Kontakt darf gefangen werden.
          * 🔵 Kein Fangen.
          * 🔴 Drei Kontakte Pflicht (Bagger – Pritsche – rüber).
          * Spiele auf 7, danach Gegner wechseln.

          **Trainer-Details:** Gemischte Paare (stark + schwächer) bilden. Punkt zählt doppelt, wenn das schwächere Kind den Ball rüberspielt.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Hausaufgabe: Baggern gegen eine Hauswand, 3x 2 Minuten.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 3
    einheiten:
    - name: TE 5
      dauer: 90
      titel: Pritschen mit Richtungswechsel
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball hochwerfen, halbe Drehung, fangen. Danach: Ball nach hinten über den Kopf werfen und unter den Ball drehen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: ✋
        phase: Handhaltung
        dauer: 10
        titel: Freeze-Fangen im Paar
        bild: bilder/handhaltung-freeze.svg
        inhalt: |-
          **Ablauf:** Paare, 3 m Abstand. A wirft den Ball hoch auf die Stirn von B. B fängt im Körbchen und friert ein. A prüft die 3 Merkpunkte und gibt Daumen hoch, dann drückt B den Ball aus der Haltung zurück. Nach 10 Würfen wechseln.

          * 🟢 Fangen, 2 Sekunden einfrieren, zurückdrücken.
          * 🔵 Nur noch ganz kurz fangen, sofort zurückdrücken. Auf Zuruf „Freeze!“ von A trotzdem einfrieren.
          * 🔴 Direkt pritschen, aber bei jedem 5. Ball ruft A „Freeze!“ und B muss den Ball im Körbchen festhalten.
          * Zusatz für Kräftige: Mit Basketball oder weichem Medizinball (höchstens 1 kg) nur fangen und zurückdrücken, kein Pritschen in der Luft. Der schwere Ball zwingt die Finger auseinander.

          **Trainer-Details:** Das Prüfen macht die Partner zu Mini-Trainern und schärft den Blick für die eigene Haltung. **Die 3 Merkpunkte (Körbchen):** 1. Daumen zeigen zur Nase, nicht nach vorn. 2. Finger weit gespreizt, nur die Finger berühren den Ball, die Handflächen bleiben frei. 3. Hände eine Faust breit über und vor der Stirn, Ellbogen schräg nach außen.
        varianten:
          6-8: Trainer übernimmt bei einem Paar das Werfen und Prüfen, damit jedes Kind einmal direkt korrigiert wird.
          9-12: '3er-Gruppen bei Ballmangel: einer wirft, einer fängt, einer prüft. Nach 10 Würfen rotieren.'
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Neu: Pritschen mit Vierteldrehung nach jedem Kontakt (Ball bleibt am Platz).

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Pritschen im Dreieck
        bild: bilder/dreieck-pritschen.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen im Dreieck, 3–4 m Abstand, Ball läuft im Uhrzeigersinn, nach 1 Minute gegen den Uhrzeigersinn.

          * 🟢 Fangen – drehen – zum Nächsten pritschen.
          * 🔵 Direkt pritschen, Körper zum Ziel drehen.
          * 🔴 Zusätzlich Selbstpass vor jedem Weiterspielen; Ziel 15 Runden ohne Fehler.

          **Trainer-Details:** Zum Ziel drehen, **bevor** der Ball ankommt. Wer sich während des Kontakts dreht, spielt ungenau.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 diagonal
        bild: bilder/1v1-diagonal.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Feld wird diagonal geteilt; Punkt zählt doppelt, wenn der Ball in der Ecke (Reifen/Markierung) landet.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 15
        titel: 2:2 Königsfeld
        bild: bilder/2v2-koenigsfeld.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Ein Königsfeld, Herausforderer-Teams warten hinten (max. 1 Team).
          * Herausforderer schlagen von unten ein. Holen sie den Punkt, sind sie König.
          * Königsteam muss 3 Punkte in Folge machen, um einen Bonuspunkt zu bekommen.
          * 🟢/🔵/🔴 wie in der letzten Woche, jedes Team wählt.

          **Trainer-Details:** Schnelle Wechsel, kurze Ballwechsel, hoher Spaß. Bei 9–12 Kindern lieber 2 Königsfelder.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Nächste Woche ist Check-Woche: Jeder überlegt, welche Stufe er schaffen will.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 6
      tag: Freitag
      dauer: 120
      titel: Pritschen und Baggern im Wechsel
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Kettenfangen mit Ball
        bild: bilder/kettenfangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Die Fänger-Kette darf nur fangen, solange sie sich einen Ball zupritscht oder zuwirft (aus Pritschhaltung).
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Baggern allein (Brett bauen)
        bild: bilder/baggern-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Erst 1 Minute Brett zeigen: Hände ineinander, Daumen parallel, Arme gestreckt, Schultern nach vorn.

          * 🟢 Ball aus 1 m auf das Brett fallen lassen, hochspringen lassen, fangen. Ziel: 10x sauber.
          * 🔵 Bagger über dem Kopf, Ball mind. auf Kopfhöhe. Ziel: 15 in Folge.
          * 🔴 Wechsel Bagger – Pritsche – Bagger. Ziel: 20 in Folge.
          * Neu: Bagger hoch – Ball fällt auf Boden – aufspringen lassen – wieder baggern.

          **Trainer-Details:** Arme bleiben fast still, gespielt wird aus den Beinen. Ball trifft die Unterarme oberhalb der Handgelenke.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Wechselspiel Pritsche/Bagger
        bild: bilder/wechselspiel.svg
        inhalt: |-
          **Ablauf:** Paare, 4 m Abstand. A spielt abwechselnd hoch (Pritschball) und kurz/tief (Baggerball).

          * 🟢 A wirft, B entscheidet: hoch = Pritsche, tief = Bagger.
          * 🔵 A pritscht und baggert, B spielt zurück.
          * 🔴 Durchgehend, ohne Fangen, 20 in Folge.

          **Trainer-Details:** Entscheidung früh treffen. Häufiger Fehler: Pritschball wird gebaggert, weil die Beine zu spät kommen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik III
        dauer: 15
        titel: 'Ball über die Leine: Paar gegen Paar kooperativ'
        bild: bilder/2v2-kooperativ.svg
        inhalt: |-
          **Ablauf:** Zwei Paare spielen sich über eine Leine den Ball zu, **ohne** Punkte. Jede Seite 2 Kontakte.

          * 🟢 1. Kontakt fangen erlaubt.
          * 🔵 Kein Fangen, 10 Überquerungen in Folge.
          * 🔴 3 Kontakte pro Seite, 10 Überquerungen.

          **Trainer-Details:** Kooperativ heißt: Ziel ist ein langer Ballwechsel. Das gibt Einsteigern viele Kontakte ohne Druck.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 1:1 Wahlweise
        bild: bilder/1v1-wahlweise.svg
        inhalt: |-
          **Ablauf:** Spielreihe nach RTK: 1:1 auf Kleinfeld (ca. 3 × 4,5 m pro Seite) über Leine, Langbank oder niedriges Netz (ca. 2,00 m).

          * Ball darf mit Bagger oder Pritsche rüber; ein Kontakt muss Bagger sein.
          * 🟢 Ball darf nach dem 1. Kontakt gefangen und pritschend „zurückgeworfen“ werden.
          * 🔵 Erst Selbstpass (pritschen oder baggern), dann über die Leine pritschen.
          * 🔴 Wie 🔵, aber der Ball muss hinter einer Markierung (hintere Feldhälfte) landen.

          **Trainer-Details:** Das 1:1 ist die beste Schule für Ballkontrolle: Jedes Kind spielt jeden Ball. Spiele auf 5 Punkte, dann rotieren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 25
        titel: 2:2 Turnier „Jeder gegen jeden“
        bild: bilder/2v2-turnier.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Feste Paare für heute, jeder spielt einmal gegen jedes andere Paar, 4 Minuten pro Spiel.
          * Stufen wie in Woche 2. Ein Punkt Bonus für einen Ballwechsel mit mehr als 6 Kontakten.

          **Trainer-Details:** Paare mischen (stark + schwächer). Spielstände an der Wand notieren, Sieger am Ende ehren.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 10
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Hausaufgabe: Den eigenen Pritsch- und Baggerrekord zuhause probieren.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Woche 4
    einheiten:
    - name: TE 7
      dauer: 90
      titel: 'Check-Woche: Basics-Abzeichen'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Alle Aufgaben aus dem Monat einmal wiederholen.

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🎯
        phase: Technik I
        dauer: 25
        titel: Basics-Abzeichen Pritschen & Baggern
        bild: bilder/abzeichen-stationen.svg
        inhalt: |-
          **Ablauf:** Stationen mit je einem Kind als Zähler. Jedes Kind hat 2 Versuche pro Station. Ergebnis auf eine Liste.

          * Vorab 2 Minuten Körbchen-Check: Ball über der Stirn einfrieren, der Partner prüft die 3 Merkpunkte.
          * Station 1: Pritschen allein über Kopf (in Folge).
          * Station 2: Baggern allein über Kopf (in Folge).
          * Station 3: Pritschen gegen die Wand aus 2 m (in Folge).
          * Station 4: Paar-Bagger, 10 Zuwürfe, wie viele kommen fangbar zurück?
          * 🟢 Abzeichen: 10 / 🔵 Abzeichen: 20 / 🔴 Abzeichen: 30 (Stationen 1–3).

          **Trainer-Details:** Kein Wettkampf gegeneinander, sondern gegen den eigenen Rekord. Die Liste ist die Grundlage für die Stufen im nächsten Monat.
        varianten:
          6-8: Zwei Kinder pro Station, eines spielt, eines zählt.
          9-12: Drei Kinder pro Station, rotieren nach jedem Durchgang.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Lücken schließen
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Freie Übungszeit in Paaren: Jedes Kind übt die Station, die ihm am schwersten fiel.

          * Trainer geht herum und korrigiert genau **einen** Punkt pro Kind.

          **Trainer-Details:** Individuelles Feedback ist hier wichtiger als ein neues Spiel.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 35
        titel: Kaiserturnier 2:2
        bild: bilder/kaiser-2v2.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (2:2). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 3 Minuten.

          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Regeln aus Woche 3; im Kaiserfeld kein Fangen.
          * Im Einsteigerfeld darf ein Ball pro Ballwechsel gefangen werden.

          **Trainer-Details:** Nach 2–3 Runden spielen alle gegen ähnlich Starke, ohne dass jemand eingeteilt werden muss.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Abzeichen verkünden und loben.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
    - name: TE 8
      tag: Freitag
      dauer: 120
      titel: Monatsturnier 2:2
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Ball-Retter (Lieblingsspiel)
        bild: bilder/ball-retter.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Wie in Woche 1: Wer den Ball in Pritschhaltung über dem Kopf hält, ist sicher.
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Hampelmann, Hopserlauf.
          * Zum Schluss jedes Kind mit Ball: 20x hochwerfen und in Pritschhaltung fangen.

          **Trainer-Details:** Laufen, Reagieren und Ball in einem. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: Einspielen im Paar
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare, freies Einspielen: 3 Minuten Pritschen, 3 Minuten Baggern, 3 Minuten Wechsel, dann über die Leine.

          **Trainer-Details:** Wie vor einem echten Spiel. Kinder sollen den Ablauf lernen, sich selbst einzuspielen.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: Kooperativ-Rekord über die Leine
        bild: bilder/2v2-kooperativ.svg
        inhalt: |-
          **Ablauf:** Zwei Paare über die Leine, ohne Punkte: Wie viele Überquerungen schafft ihr? Drei Durchgänge, der beste zählt.

          * 🟢 1. Kontakt fangen erlaubt. 🔵 Kein Fangen. 🔴 3 Kontakte pro Seite.

          **Trainer-Details:** Hallenrekord an die Tafel schreiben – im nächsten Monat wird er geknackt.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 60
        titel: Monatsturnier 2:2
        bild: bilder/2v2-turnier.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Gemischte, ausgeloste Paare. Gruppenphase (jeder gegen jeden, 5 Minuten), dann Platzierungsspiele.
          * Jedes Paar wählt vor jedem Spiel seine Stufe; Stufe 🔴 gibt bei Sieg 1 Zusatzpunkt.
          * Pausierende Paare pfeifen und zählen.

          **Trainer-Details:** Kinder schiedsrichtern lassen: Sie lernen Regeln und bleiben aktiv.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 15
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Monatsrückblick: Was kann ich jetzt, was ich vor 4 Wochen nicht konnte? Siegerehrung.

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
  - name: Extra
    einheiten:
    - name: Annahme-Spezial
      tag: Freitag
      datum: 2026-10-30
      dauer: 120
      titel: 'Annahme-Spezial: Beine und Brett'
      schwerpunkt:
        kurz: 'Erst stehen, dann spielen'
        achte_auf: 'Das Kind ist vor dem Ball am Treffpunkt und steht still (Füße stoppen, Knie gebeugt), bevor der Ball kommt. Das Brett ist schon gebaut, wenn der Ball noch in der Luft ist, und die Arme schwingen nicht.'
        sag_dazu: 'Erst stehen, dann spielen!'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Brett-Fangen
        bild: bilder/brett-fangen.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen. Ein paar Bälle liegen am Rand.

          * Wer gefangen wird, friert sofort in der Annahme-Stellung ein: Füße schulterbreit, Knie gebeugt, Brett vor dem Körper.
          * **Befreien:** Ein Retter holt einen Ball, lässt ihn aus Kopfhöhe auf das Brett fallen. Springt der Ball hoch und der Eingefrorene fängt ihn, ist er frei. Fällt der Ball daneben, nochmal.
          * Ein Eingefrorener mit krummen Armen oder geraden Beinen darf nicht befreit werden. Die Retter kontrollieren das.
          * Alle 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Sidesteps mit Bodenberührung.

          **Trainer-Details:** Das Spiel übt das Brett, ohne dass es nach Technik aussieht. Jedes Kind baut in 10 Minuten 10 bis 20 Mal das Brett. Wer lange eingefroren steht, bekommt Kraft in die Beine. Für die Fänger reicht ein Abschlagen mit der Hand.
        varianten:
          6-8: 1 Fänger, kleineres Feld (halbes Volleyballfeld).
          9-12: 2 Fänger, ganzes Volleyballfeld, 3–4 Bälle am Rand.
      - icon: 🧱
        phase: Basics Arme
        dauer: 10
        titel: 'Brett-Polizei: Hände, Arme, Beine'
        bild: bilder/bagger-merkbild.svg
        inhalt: |-
          **Ablauf:** Paare mit einem Ball. Ein Kind übt, der Partner ist die „Brett-Polizei“ und prüft die 3 Merkpunkte. Für jede saubere Ausführung gibt es einen Punkt. Nach jeder Aufgabe tauschen.

          * **Brett in 1 Sekunde:** Locker laufen, auf „Brett!“ sofort stehen, Knie beugen, Brett zeigen. Die Polizei prüft: Daumen parallel? Arme gestreckt? Knie gebeugt?
          * **Ball tragen:** Ball liegt auf dem Brett. Einmal um die Polizei herumgehen, dabei in die Hocke und wieder hoch. Ball fällt nicht = 1 Punkt.
          * **Treffpunkt:** Polizei lässt den Ball aus 30 cm auf das Brett fallen. Er soll eine Handbreit über den Handgelenken auftreffen und senkrecht zurückspringen. Senkrecht = 1 Punkt.
          * **Brett-Schieber:** Polizei hält den Ball vor dem Bauch fest. Das Kind schiebt mit dem Brett nur durch Strecken der Beine. Arme wackeln = kein Punkt.
          * 🟢 Softball, Treffpunkt aus 30 cm und Ball danach fangen.
          * 🔵 Treffpunkt aus 60 cm, Ball springt zur Polizei zurück.
          * 🔴 Ball tragen im Sidestep und rückwärts, Treffpunkt aus 1 m.

          **Trainer-Details:** **Die 3 Merkpunkte (Brett):** 1. Hand in Hand legen, Daumen liegen parallel nebeneinander. 2. Arme gestreckt, Ellbogen zusammen, so wird das Brett flach. 3. Knie gebeugt, Ball vor dem Körper treffen, gespielt wird aus den Beinen, nicht aus den Armen. Typische Fehler: Daumen über Kreuz, Ellbogen gebeugt, Ball trifft die Hände. Am Ende fragen: Welches Paar hat die meisten Punkte?
        varianten:
          6-8: Trainer geht von Paar zu Paar und ist bei einer Aufgabe selbst die Polizei.
          9-12: 'Zwei Paare bilden eine Gruppe: ein Paar übt, das andere prüft mit, nach jeder Aufgabe wechseln.'
      - icon: 🦶
        phase: Basics Beine
        dauer: 15
        titel: Ampel-Beinarbeit
        bild: bilder/annahme-ampel.svg
        inhalt: |-
          **Ablauf:** Jedes Kind hat einen eigenen Platz mit 4 Hütchen im Abstand von 2 m: links blau, rechts grün, vorn gelb, hinten rot (Farben nach dem, was da ist). Der Trainer steht vorn und zeigt eine Farbe (Karte, Hütchen hochhalten oder rufen).

          * **Ohne Ball (5 Min):** Auf die Farbe mit Sidesteps (seitlich), kleinen Schritten (vorn) oder Rückwärtsschritten (hinten) zum Hütchen. Dort stoppen, Brett bilden, eine Baggerbewegung aus den Beinen, zurück in die Mitte.
          * **Ampel-Duell (5 Min):** Zwei Kinder stehen nebeneinander mit eigenen Hütchen. Wer zuerst sauber im Brett am richtigen Hütchen steht, bekommt einen Punkt. Falsche Farbe = Punkt für den anderen. Bis 5, dann neuer Gegner.
          * **Doppel-Farbe (5 Min):** Trainer zeigt zwei Farben nacheinander („blau – gelb“). Erst zum ersten Hütchen, Brett, dann direkt zum zweiten, Brett, dann zurück.
          * 🟢 Trainer ruft die Farbe und zeigt gleichzeitig mit dem Arm die Richtung.
          * 🔵 Nur die Farbe, ohne Richtung.
          * 🔴 Trainer zeigt die Farbe und das Kind läuft zur **gegenüberliegenden** Seite.

          **Trainer-Details:** Sidesteps flach über den Boden, Füße kreuzen nicht. Beim Stopp sind die Füße schulterbreit, das Gewicht auf den Fußballen, die Knie gebeugt. Wer im Duell schneller ist, aber mit hohen Beinen ankommt, bekommt keinen Punkt: Schnell **und** sauber zählt.
        varianten:
          6-8: Alle gleichzeitig, jeder an eigenen Hütchen. Duelle in Paaren nebeneinander.
          9-12: 'Hütchen in 2 Reihen aufbauen, je 2 Kinder pro Platz: eines läuft, das andere ist Schiedsrichter und zählt Punkte, nach 1 Minute Wechsel.'
      - icon: 🎯
        phase: Technik I
        dauer: 15
        titel: 'Laufen, stoppen, spielen (10er-Leiter)'
        bild: bilder/bagger-beinarbeit.svg
        inhalt: |-
          **Ablauf:** Paare mit einem Ball, 3–4 m Abstand. A wirft, B läuft hin, stoppt hinter dem Ball und baggert zu A zurück. Nach 10 Würfen tauschen.

          * **10er-Leiter:** Jedes Kind zählt, wie viele der 10 Bälle A ohne Schritt fangen kann. Das ist die Leiterstufe. Ziel ist, in der zweiten Runde eine Stufe höher zu kommen.
          * Erst nur nach vorn werfen, dann links und rechts, dann gemischt.
          * 🟢 Ball darf einmal aufspringen, dann baggern. A wirft nur 1 Schritt neben B.
          * 🔵 Direkt baggern, 2 Schritte neben B.
          * 🔴 A wirft spät und gemischt (auch kurz vor B), 2–3 Schritte.

          **Trainer-Details:** Leitsatz: „Erst stehen, dann spielen.“ Wer den Ball im Laufen spielt, läuft zu spät los: Blick schon beim Wurf auf die Hand von A. Der Ball wird vor dem Körper getroffen, nicht neben dem Körper. Rekorde der Leiter merken für die Brett-Meister-Challenge am Ende.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Kind zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme-Punktejagd mit Freeze-Bonus
        bild: bilder/annahme-punktejagd.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen. A wirft auf B, B baggert in Richtung Ziel: ein Reifen am Boden vor C. C steht am Netz wie ein Zuspieler und fängt. Nach 8 Würfen Rollen tauschen, bis jeder 2x angenommen hat. Alle Gruppen spielen als Teams gegeneinander.

          * **Punkte:** Ball landet im Reifen = 3 Punkte. C fängt ohne Schritt = 1 Punkt.
          * **Freeze-Bonus:** Der Trainer pfeift ab und zu direkt nach dem Bagger. Alle Annehmer frieren ein. Zeigt das Brett noch zum Ziel und sind die Knie gebeugt, gibt es +1. Wer die Arme hochgerissen hat, bekommt keinen Bonus.
          * Nach 10 Minuten Zwischenstand, dann Ziel wechseln (Reifen auf die andere Seite).
          * 🟢 A wirft auf den Bauch von B, Reifen 2 m vor B.
          * 🔵 A wirft 1–2 Schritte seitlich, Reifen 3–4 m entfernt am Netz.
          * 🔴 A schlägt von unten auf (aus 5–6 m), Reifen am Netz.

          **Trainer-Details:** Der Freeze-Bonus belohnt die Armstellung und nicht nur das Ergebnis. Die Kinder merken schnell, dass ein ruhiges Brett mehr Punkte bringt als Schwung aus den Schultern. Bei Bällen von der Seite: Bauchnabel zum Ziel drehen, dann kippt das Brett von selbst. Teampunkte auf einem Zettel oder an der Tafel festhalten.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; im Paar wirft A und fängt selbst.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Reifen.
      - icon: 🏆
        phase: Spielform
        dauer: 30
        titel: 'Annahme-Kaiser 2:2 (Fang-Volleyball mit Bagger)'
        bild: bilder/kaiser-2v2.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeldern, Netz 2,00 m oder Leine. Felder von „Einsteiger“ bis „Kaiser“ aufsteigend. Runden à 3 Minuten, Sieger gehen ein Feld hoch, Verlierer eins runter.

          * Der Ball kommt mit einem Wurf von unten über das Netz.
          * **Der erste Kontakt muss ein Bagger sein.** Der Partner fängt den Ball und wirft ihn von unten über das Netz.
          * Punkt, wenn der Ball beim Gegner auf den Boden fällt oder der Gegner nicht annehmen kann.
          * **Brett-Bonus:** Eine Annahme, die der Partner ohne Schritt fangen kann, zählt doppelt.
          * 🟢 Am Einsteigerfeld: Ball darf vor der Annahme einmal aufspringen.
          * 🔵 Direkt annehmen.
          * 🔴 Am Kaiserfeld: Partner spielt den zweiten Ball als Pritsche zum Partner oder über das Netz statt zu fangen.

          **Trainer-Details:** Durch das Fangen entstehen lange Ballwechsel mit vielen Annahmen. Der Trainer steht am Feld mit den meisten Problemen und erinnert nur an eine Sache: „Erst stehen, dann spielen.“ Wer auf dem Kaiserfeld eine Runde gewinnt, bleibt dort.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, ist Schiedsrichter auf dem Kaiserfeld und wechselt nach jeder Runde ein.
          9-12: 3–4 Kleinfelder quer zur Halle (Leinen/Langbänke). Bei ungerader Zahl spielt ein 3er-Team im untersten Feld.
      - icon: 🧘
        phase: Abschluss
        dauer: 15
        titel: Brett-Meister-Challenge
        bild: bilder/baggern-paar.svg
        inhalt: |-
          **Ablauf:** Zum Schluss die Challenge, bei der jedes Kind sein Abzeichen holen kann. Paare, A wirft 10 Bälle wie in der 10er-Leiter, B nimmt an. Gezählt wird, wie viele A ohne Schritt fängt.

          * 🟢 **Brett-Meister Grün:** 5 von 10 (Ball darf aufspringen).
          * 🔵 **Brett-Meister Blau:** 7 von 10, Würfe 1–2 Schritte seitlich.
          * 🔴 **Brett-Meister Rot:** 8 von 10, gemischt und spät geworfen.
          * Danach kurz im Kreis: Jedes Kind nennt seine Stufe von heute. Merksatz: „Erst stehen, dann spielen. Brett still, Beine hoch.“

          **Trainer-Details:** Die Ergebnisse notieren. In Monat 2 (Annahme) kann jedes Kind seinen Titel verteidigen oder eine Stufe aufsteigen. Lob für Verbesserung gegenüber der 10er-Leiter, nicht nur für die Besten.
        varianten:
          6-8: Alle gleichzeitig, Trainer schaut reihum bei jedem Paar 10 Bälle zu.
          9-12: 'Je 2 Paare zusammen: ein Paar spielt, das andere zählt mit.'
- name: Monat 2
  thema: 'Aufschlag, Annahme & Zuspiel: das Drei-Kontakte-Spiel im 2:2 und 3:3'
  titel: Drei Kontakte
  wochen:
  - name: Spielwoche
    einheiten:
    - name: Spielwoche Mi
      datum: 2026-11-04
      dauer: 90
      titel: 'Spielwoche: Kontakte sammeln, Spiele spielen'
      schwerpunkt:
        kurz: 'Ball ankündigen: „Ich!“'
        achte_auf: 'Vor jedem ersten Kontakt ruft ein Kind laut „Ich!“. Der Partner dreht sich sofort zum Ball und macht sich für den zweiten Ball bereit. Kein Ball fällt zwischen zwei Kindern auf den Boden, weil beide warten.'
        sag_dazu: 'Ruf ihn: Ich!'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle. Auf Pfiff wechselt die Aufgabe, alle 60 Sekunden.

          * Gehen und sich selbst hochpritschen, auf Pfiff in die Hocke und weiter.
          * Gehen und sich selbst hochbaggern.
          * Im Wechsel: einmal Pritsche, einmal Bagger.
          * Kontakte-Minute: Wer schafft die meisten Kontakte ohne Bodenkontakt des Balls?
          * 🟢 Ball darf zwischen den Kontakten einmal aufspringen.
          * 🔵 Ohne Aufspringen.
          * 🔴 Nach jedem Kontakt einmal den Boden berühren.

          **Trainer-Details:** In 10 Minuten schafft jedes Kind so 150 bis 250 Kontakte. Nicht unterbrechen, nur Aufgaben ansagen.
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Einspielen wie vor einem Spiel
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Paare, immer derselbe Ablauf wie vor einem Spiel am Spieltag:

          * 3 Minuten Pritschen, 3 Minuten Baggern, 2 Minuten im Wechsel (Bagger – Pritsche).
          * 2 Minuten: Aufschläge über das Netz zum Partner, der fängt.

          **Trainer-Details:** Diesen Ablauf am Freitag wiederholen und die Kinder ihn dann selbst starten lassen. Am Spieltag kennen sie das Einspielen und sind ruhig.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: 'Dauer-Dreieck: Bagger – Pritsche – Pritsche'
        bild: bilder/dreieck-bpf.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen im Dreieck, 3–4 m Abstand, ein Ball pro Gruppe. Der Ball soll so lange wie möglich in der Luft bleiben, wie im Spiel: Annahme mit Bagger, Zuspiel mit Pritsche, dritter Ball mit Pritsche zum Nächsten.

          * Jedes Kind ruft vor seinem Kontakt „Ich!“.
          * Die Gruppe zählt laut. Fällt der Ball, beginnt die Zählung neu. Bester Wert ist der Gruppenrekord.
          * Nach 5 Minuten die Richtung wechseln, nach 10 Minuten neue Gruppen.
          * 🟢 Ein Kontakt pro Runde darf gefangen und neu angeworfen werden.
          * 🔵 Ohne Fangen.
          * 🔴 Jedes Kind spielt zwei Kontakte (Selbstpass, dann weiter).

          **Trainer-Details:** Hier entstehen in kurzer Zeit sehr viele Kontakte. Hoch spielen hilft dem Nächsten: Wer den Ball flach spielt, macht es dem Partner schwer. Rekorde an die Tafel schreiben.
        varianten:
          6-8: Zwei 3er-Gruppen, übrige Kinder als Paar mit Pritsche und Bagger im Wechsel.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, bei Ballmangel eine 4er-Gruppe im Viereck.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: Aufschlag gegen Annahme (Mini-Duell)
        bild: bilder/annahme-duell.svg
        inhalt: |-
          **Ablauf:** Auf jedem Kleinfeld: 2 Aufschläger gegen 2 Annehmer plus 1 Zuspieler am Netz.

          * Annahme zum Zuspieler, der fängt: 1 Punkt für das Annahme-Team.
          * Aufschlag-Ass oder Annahmefehler: 1 Punkt für die Aufschläger.
          * Aufschlag ins Aus oder ins Netz: 1 Punkt für das Annahme-Team, wie im Spiel.
          * Nach 8 Aufschlägen Rollen tauschen, bis jeder einmal Aufschläger, Annehmer und Zuspieler war.
          * 🟢 Aufschlag aus 4–5 m.
          * 🔵 Aufschlag von der halben Spielfeldlänge.
          * 🔴 Aufschlag von der Grundlinie, Zuspieler pritscht statt zu fangen.

          **Trainer-Details:** Das ist die häufigste Situation im Spiel: Aufschlag kommt, Annahme muss hoch zur Mitte. Annehmer rufen „Ich!“ und stehen vor dem Ball still.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 30
        titel: Kaiserturnier 2:2 mit Aufschlag
        bild: bilder/kaiser-2v2.svg
        inhalt: |-
          **Ablauf:** Mehrere Kleinfelder nebeneinander (2:2, ca. 4,5 × 4,5 m pro Seite). Feld 1 = Kaiserfeld, letztes Feld = Einsteigerfeld. Runden à 4 Minuten.

          * Jeder Ballwechsel beginnt mit Aufschlag von unten.
          * Gewinner rutscht ein Feld hoch, Verlierer ein Feld runter.
          * Nach jeder zweiten Runde Partner wechseln.
          * 🟢 Einsteigerfeld: Annahme darf gefangen werden, Aufschlag darf einmal wiederholt werden.
          * 🔵 Mittlere Felder: Kein Fangen.
          * 🔴 Kaiserfeld: 3 Kontakte Pflicht.

          **Trainer-Details:** Viele kurze Runden statt langer Sätze: So spielt jedes Kind möglichst viele Ballwechsel. Der Trainer achtet nur auf das „Ich!“.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Was nehme ich mit ins Spiel?
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt eine Sache, die es am Spieltag machen will (z. B. „Ich rufe jeden Ball“).
          * Gruppenrekord aus dem Dauer-Dreieck nennen. Am Freitag wird er wieder gejagt.

          **Trainer-Details:** Kurz halten. Lob für laute Kommunikation und mutige Aufschläge.
    - name: Spielwoche Fr
      datum: 2026-11-06
      tag: Freitag
      dauer: 120
      titel: 'Spielwoche: Generalprobe für den Spieltag'
      schwerpunkt:
        kurz: 'Nach dem Fehler: weiter!'
        achte_auf: 'Nach einem Fehler klatschen sich die Partner kurz ab und stehen sofort wieder in Grundstellung. Niemand lässt den Kopf hängen oder schimpft. Wer gerade nicht spielt, feuert an.'
        sag_dazu: 'Abklatschen, nächster Ball!'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 15
        titel: Lieblings-Fangspiel
        bild: bilder/lieblings-fangspiel.svg
        inhalt: |-
          **Ablauf:** Fangspiel in einem Volleyballfeld, 2 Fänger mit Leibchen.

          * Die Kinder wählen eines der Fangspiele aus den letzten Wochen (z. B. Brett-Fangen oder Ball-Retter).
          * Nach 2 Minuten neue Fänger. Danach 3 Minuten Mobilisation: Armkreisen, Ausfallschritte, Sidesteps mit Bodenberührung.
          * Zum Schluss jedes Kind mit Ball: 20x sich selbst hochpritschen, 20x hochbaggern.

          **Trainer-Details:** Gute Laune vor dem Spieltag. Fänger wechseln oft, damit niemand lange „dran“ bleibt.
      - icon: 🎯
        phase: Technik I
        dauer: 10
        titel: Einspielen wie vor einem Spiel (die Kinder führen)
        bild: bilder/paare-halle.svg
        inhalt: |-
          **Ablauf:** Derselbe Ablauf wie am Mittwoch, aber die Kinder starten und wechseln selbst, ohne Ansage vom Trainer:

          * 3 Minuten Pritschen, 3 Minuten Baggern, 2 Minuten im Wechsel.
          * 2 Minuten: Aufschläge über das Netz zum Partner.

          **Trainer-Details:** Genau so läuft es am Spieltag beim Einspielen. Nur eingreifen, wenn ein Paar nicht weiterweiß.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 15
        titel: 'Aufschlag-Challenge: Ein Versuch zählt'
        bild: bilder/aufschlag-challenge.svg
        inhalt: |-
          **Ablauf:** Zwei Teams, jedes auf einer Feldseite an der Aufschlaglinie (Distanz nach Stufe). Alle schlagen gleichzeitig auf die andere Seite auf, die Bälle werden auf der Gegenseite gesammelt und zurückgeschlagen.

          * Jeder Aufschlag im Feld = 1 Punkt fürs Team. Erstes Team mit 30 Punkten gewinnt.
          * **Spieltag-Runde:** Danach schlägt jedes Kind einzeln auf, alle schauen zu. Nur ein Versuch, wie im Spiel. Das Team feuert an.
          * 🟢 Aufschlag aus 4–5 m.
          * 🔵 Von der halben Spielfeldlänge.
          * 🔴 Von der Grundlinie, Ziel ist die hintere Feldhälfte.

          **Trainer-Details:** In der Spieltag-Runde lernen die Kinder, mit Druck aufzuschlagen. Ruhiges Ritual vor dem Aufschlag: Ball zweimal prellen, durchatmen, Ziel anschauen. Wer daneben schlägt, wird abgeklatscht.
        varianten:
          6-8: Ein Feld, alle schlagen von einer Seite auf, ein Kind sammelt gegenüber und wechselt nach 2 Minuten.
          9-12: Ein Volleyballfeld, zwei Teams, bei Ballmangel in zwei Wellen aufschlagen.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: 2:2 „Annahme zählt doppelt“
        bild: bilder/2v2-annahme-doppelt.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine. Spiele bis 11, dann neue Gegner.

          * Normales 2:2 mit Aufschlag.
          * Ein Punkt nach guter Annahme (der Partner kann pritschen) zählt doppelt.
          * Nach jedem Punkt, egal für wen: Partner abklatschen.
          * 🟢 Annahme darf gefangen werden. 🔵 Kein Fangen. 🔴 3 Kontakte Pflicht.

          **Trainer-Details:** Die Annahme wird belohnt, nicht nur der Punkt. Das Abklatschen nach jedem Punkt üben, bis es von selbst passiert.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧠
        phase: Spielform
        dauer: 20
        titel: Spielstand-Spiele (enge Satzenden)
        bild: bilder/4v4-spielstand.svg
        inhalt: |-
          **Ablauf:** 2:2 oder 3:3 (in der Spielform vom Spieltag). Jedes Spiel startet mit einem vorgegebenen Spielstand und geht bis 15:

          * **12:12:** Wer behält die Nerven?
          * **11:14:** Ein Team liegt zurück und muss aufholen.
          * **14:14:** Zwei Punkte Vorsprung zum Sieg.
          * Nach jedem Spiel neue Gegner, das zurückliegende Team darf sich die Aufschlagseite aussuchen.

          **Trainer-Details:** Die Kinder lernen, mit Druck umzugehen. Nach den Spielen kurz fragen: Was hat geholfen, als es eng wurde? (Typische Antworten: sicher aufschlagen, laut rufen, hoch spielen.)
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 35
        titel: 'Generalprobe: Mini-Spieltag'
        bild: bilder/3v3-turnier.svg
        inhalt: |-
          **Ablauf:** Teams und Spielform wie am Spieltag (2:2 oder 3:3). Kleines Turnier, jeder gegen jeden, Sätze bis 15 (oder 7 Minuten).

          * Vor dem ersten Spiel: Teamkreis, Schlachtruf, Aufstellung festlegen.
          * Gespielt wird nach Wettkampfregeln, Aufschlag nach Stufe.
          * Jedes Team darf pro Satz eine Auszeit nehmen. In der Auszeit sagt jedes Kind einen Satz (z. B. „Wir rufen lauter“).
          * Wer gerade frei ist, pfeift und zählt als Schiedsrichter.
          * 🟢 Annahme darf gefangen werden. 🔵 Kein Fangen. 🔴 3 Kontakte Pflicht.

          **Trainer-Details:** Die Kinder sollen einmal erleben, wie ein Spieltag abläuft: Begrüßung, Schlachtruf, Auszeit, Seitenwechsel, Abklatschen mit dem Gegner am Ende. Der Trainer coacht nur in den Auszeiten, so wie am Spieltag.
        varianten:
          6-8: Zwei Teams spielen, das dritte Team pfeift und zählt. Nach jedem Satz wechseln.
          9-12: Zwei Felder gleichzeitig, Turnierplan an die Tafel. Freie Kinder sind Schiedsrichter.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Spieltag-Kreis
        inhalt: |-
          **Ablauf:** Alle im Kreis.

          * Jedes Kind nennt einen Moment aus der Woche, auf den es stolz ist.
          * Kurz klären: Wann treffen wir uns am Spieltag, was kommt in die Tasche (Trikot, Trinkflasche, Hallenschuhe, Snack)?
          * Gemeinsamer Schlachtruf.

          **Trainer-Details:** Mit einem guten Gefühl in den Spieltag gehen. Lob für Teamgeist und Mut, nicht nur für Siege.
  - name: Woche 1
    einheiten:
    - name: TE 1
      dauer: 90
      titel: Aufschlag von unten
      schwerpunkt:
        kurz: 'Haltehand bleibt ruhig'
        achte_auf: 'Der Ball liegt ruhig auf der flachen Haltehand, auf Hüfthöhe vor dem Körper auf der Seite der Schlaghand. Er wird höchstens kurz angehoben, nicht hochgeworfen. Wer den Ball wirft, trifft ihn zufällig.'
        sag_dazu: 'Ball liegt, Hand schlägt!'
      uebungen:
      - icon: 🏃‍♂️
        phase: Warm-up
        dauer: 10
        titel: 'Ballschule: Jeder hat einen Ball'
        bild: bilder/ballschule.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball frei in der Halle, auf Pfiff wechselt die Aufgabe alle 45–60 Sekunden.

          * Laufen und Ball beidhändig prellen, auf Pfiff tiefe Grundstellung, Ball dabei weiterprellen.
          * Ball hochwerfen, darunterlaufen und **über der Stirn** fangen (Pritsch-Dreieck mit Daumen und Zeigefingern).
          * Ball hochwerfen, hinsetzen, aufstehen, fangen. Danach: einmal klatschen, umdrehen, Boden berühren.
          * Ball mit einer Hand von unten gegen die Wand schlagen, fangen (Aufschlag-Gefühl).

          **Trainer-Details:** Immer mit Ball: Im Kinder-Volleyball ist jedes Aufwärmen auch Ballgewöhnung. Kurze Aufgaben, viel Abwechslung, keine Runden ohne Ball.
        varianten:
          6-8: Trainer macht mit und gibt Tempo vor.
          9-12: Zwei Kinder dürfen abwechselnd eine Aufgabe ansagen.
      - icon: 🧱
        phase: Basics
        dauer: 10
        titel: Pritschen aus den Beinen
        bild: bilder/pritschen-beine.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball. Drei Aufgaben, Trainer zählt laut mit.

          * **Hocke und hoch (3 Min):** Ball im Körbchen über der Stirn, tief in die Knie. Beine strecken und den Ball aus dem Körbchen senkrecht hochdrücken, wieder fangen. Die Arme strecken erst, wenn die Beine schon arbeiten.
          * **Höhen-Treppe (4 Min):** Pritschen allein. Trainer ruft „1!“, „2!“ oder „3!“ für 1 m, 2 m oder 3 m Ballhöhe. Höher wird es durch mehr Beine, nicht durch mehr Arme.
          * **Schrittstellung (3 Min):** Rechter Fuß eine halbe Fußlänge vor. 10 Pässe gegen die Wand aus 3 m, jeder Pass mit Strecken bis auf die Zehenspitzen.
          * 🟢 Hocke und hoch mit Fangen bei jeder Aufgabe, Treppe nur 1 m und 2 m.
          * 🔵 Durchgehend pritschen. Ziel: 3 Treppen-Runden (1 – 2 – 3 m) ohne Fehler.
          * 🔴 Wand aus 4 m, oder abwechselnd Hocke (tiefer Ball) und Strecken (hoher Ball).

          **Trainer-Details:** Ganzkörperbewegung: Beine, Rumpf und Arme strecken in einer Welle in Spielrichtung. Gute Pritscher landen nach dem Pass auf den Zehenspitzen. Die Handhaltung bleibt wie gelernt (Körbchen über der Stirn).
        varianten:
          6-8: Alle gleichzeitig, Trainer macht die Höhen-Treppe vor und zählt.
          9-12: 'Zwei Gruppen: eine an der Wand, eine frei in der Halle, nach 5 Minuten wechseln.'
      - icon: 🎯
        phase: Technik I
        dauer: 5
        titel: Pritschen allein (Kontakte zählen)
        bild: bilder/pritschen-allein.svg
        inhalt: |-
          **Ablauf:** Jedes Kind mit eigenem Ball, Platz an Wand oder frei in der Halle. Nach jedem Versuch laut zählen.

          * 🟢 Ball hochwerfen, über der Stirn fangen, sofort wieder hochdrücken (Fang-Pritschen). Ziel: 10 in Folge.
          * 🔵 Pritschen über dem Kopf, Ball mind. 1 m hoch. Ziel: 20 in Folge.
          * 🔴 Abwechselnd hoch (3 m) und niedrig (1 m) pritschen, oder pritschen gegen die Wand aus 2 m. Ziel: 30 in Folge.
          * Kurz-Wiederholung: Jeder versucht seinen Abzeichen-Rekord zu verbessern.

          **Trainer-Details:** Wichtigste Merkpunkte: Hände **vor** der Stirn, Ball kommt von oben in die Hände, Beine strecken mit. Wer das Ziel zweimal schafft, steigt eine Stufe auf.
      - icon: 🎯
        phase: Technik I
        dauer: 20
        titel: Aufschlag von unten mit Ziel
        bild: bilder/aufschlag-ziel.svg
        inhalt: |-
          **Ablauf:** Paare an beiden Seiten des Netzes (bzw. Leine), je ein Ball pro Paar. Aufschlag aus der Distanz, die zur Stufe passt.

          * 🟢 Aufschlag von unten aus 4–5 m Entfernung vom Netz.
          * 🔵 Aufschlag von unten aus 6–7 m.
          * 🔴 Aufschlag von unten von der Grundlinie, oder Einstieg Aufschlag von oben (Tennisaufschlag) aus 6 m.
          * Ziel: Partner auf der anderen Seite soll den Ball fangen können, ohne mehr als einen Schritt zu machen.

          **Trainer-Details:** Ball ruhig in der Hand halten, nicht hochwerfen. Schlagarm pendelt gerade nach vorn, Gewicht auf den vorderen Fuß. Wer 8 von 10 trifft, geht 1 m zurück.
        varianten:
          6-8: Alle gleichzeitig in Paaren, Trainer wirft bei Bedarf selbst einem Paar zu.
          9-12: Paare an Wand, Netz und Hallenmitte verteilen. Bei Ballmangel 3er-Gruppen mit fliegendem Wechsel nach 10 Kontakten.
      - icon: 🎯
        phase: Technik II
        dauer: 20
        titel: Annahme zum Zuspieler
        bild: bilder/annahme-zuspieler.svg
        inhalt: |-
          **Ablauf:** 3er-Gruppen: A schlägt von unten auf (oder wirft über das Netz), B nimmt mit Bagger an, C steht als Zuspieler am Netz und fängt.

          * 🟢 A wirft über das Netz, Annahme darf einmal aufspringen.
          * 🔵 A schlägt von unten auf, B nimmt direkt an.
          * 🔴 C pritscht den angenommenen Ball zu B zurück, B fängt.
          * Nach 6 Bällen rotieren: A → B → C → A.

          **Trainer-Details:** Annahme hoch und in Richtung Netzmitte (Pos III). Lieber zu hoch als zu flach.
        varianten:
          6-8: Zwei 3er-Gruppen plus ein Paar; das Paar spielt die gleiche Aufgabe ohne Mittelmann.
          9-12: Drei bis vier 3er-Gruppen gleichzeitig, jede mit eigenem Ball.
      - icon: 🏆
        phase: Abschlussspiel
        dauer: 20
        titel: 2:2 mit Aufschlag
        bild: bilder/2v2-aufschlag.svg
        inhalt: |-
          **Ablauf:** 2:2 auf Kleinfeld (ca. 4,5 × 4,5 m pro Seite), Netz 2,00–2,10 m oder Leine.

          * Jeder Ballwechsel beginnt mit Aufschlag von unten (Distanz nach Stufe).
          * Aufschlagfehler: Aufschläger darf einmal wiederholen (2. Chance).
          * 🟢 1. Kontakt fangen erlaubt. 🔵 Kein Fangen. 🔴 Drei Kontakte Pflicht.

          **Trainer-Details:** Die „2. Chance“ sorgt dafür, dass das Spiel läuft und Einsteiger nicht frustriert sind.
        varianten:
          6-8: 2–3 Kleinfelder; wer gerade frei ist, zählt Punkte oder spielt Ballholer und wechselt nach jedem Spiel ein.
          9-12: 4–5 Kleinfelder quer zur Halle (Leinen/Langbänke). Kein Kind wartet länger als ein Spiel.
      - icon: 🧘
        phase: Abschluss
        dauer: 5
        titel: Kontakt-Rekord & Stufen-Check
        inhalt: |-
          **Ablauf:** Kurz im Kreis sitzen.

          * Jedes Kind nennt seinen besten Rekord von heute (z. B. „17 Pritschen in Folge“) und seine Stufe.
          * Wer hat 8 von 10 Aufschlägen getroffen?

          **Trainer-Details:** Rekorde und Aufsteiger kurz notieren. Lob für Verbesserung, nicht nur für die Besten.
